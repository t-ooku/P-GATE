<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7357ff"><link rel="icon" href="/icons/icon.svg"><link rel="stylesheet" href="/auth.css"><title>Maker &amp; Seller | HOSHILU</title></head><body>
<header class="auth-top"><a class="auth-brand" href="/"><img src="/icons/icon.svg" width="42" height="42" alt=""><span>HOSHILU</span></a><div class="auth-actions"><select class="auth-language" data-language-select aria-label="Language"><option value="JA">🇯🇵 日本語</option><option value="EN">🇺🇸 English</option><option value="ZH">🇨🇳 中文</option><option value="KO">🇰🇷 한국어</option></select><a class="back-link" href="/" data-i18n="nav.backPublic">一般画面へ</a></div></header>
<main class="auth-main"><section class="auth-card"><p class="eyebrow">MAKER &amp; SELLER</p><h1 data-i18n="seller.title">専用ログイン</h1><p data-i18n="seller.intro">メーカー、セラー、運用担当者専用です。IDとパスワードは通信時にHTTPSで保護され、認証後はHttpOnly Cookieを使用します。</p>
<form id="sellerLoginForm" class="auth-form"><label><span data-i18n="seller.id">ログインID</span><input id="sellerId" name="id" autocomplete="username" required maxlength="100"></label><label><span data-i18n="seller.password">パスワード</span><input id="sellerPassword" name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="200"></label><button id="sellerLoginButton" class="auth-button" type="submit" data-i18n="seller.login">ログイン</button><p id="sellerLoginStatus" class="auth-status" role="status"></p></form></section></main>
<script src="/site-i18n.js"></script><script type="module" src="/seller-login.js"></script></body></html>
