name: Seller promo infra (manual, OK① only)

# 2026-10-02 HOSHILU Seller「AI販促担当」（指示書 ai-promo-20261003-v2 §4）。
# 手動実行のみ。push では動かない。大隆さんの OK①（migration 本番適用とフラグ ON）の後に Claude Code が起動する。
# - R2 バケット hoshilu-seller-promo-assets を、無ければ作る（あれば何もしない）。
# - Worker Secret SELLER_PROMO_KEK を、未設定のときだけ 32 byte の乱数で作って入れる。
#   値はこのジョブの中で生成して wrangler に標準入力で渡すだけで、ログ・成果物・チャットのどこにも出ない。
#   既に設定済みなら作り直さない（鍵を替えると保存済みの WordPress 接続が復号できなくなるため）。
# CI の deploy と同じ CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID を使う。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to create the R2 bucket and the SELLER_PROMO_KEK secret on production (only if missing)'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-worker-secret-set
      cancel-in-progress: false
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "APPLY" ]; then
            echo "::error::confirm input must be exactly APPLY. Nothing was executed."
            exit 1
          fi
      - name: Check required secrets are configured
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID are not set."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create R2 bucket if missing
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx --yes wrangler@4.121.0 r2 bucket info hoshilu-seller-promo-assets > /dev/null 2>&1; then
            echo "R2 bucket hoshilu-seller-promo-assets already exists"
          else
            npx --yes wrangler@4.121.0 r2 bucket create hoshilu-seller-promo-assets
          fi
          npx --yes wrangler@4.121.0 r2 bucket info hoshilu-seller-promo-assets > /dev/null
      - name: Create SELLER_PROMO_KEK if missing (value never printed)
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 secret list --name project-gate-line-bridge > secrets.json
          if grep -Fq '"SELLER_PROMO_KEK"' secrets.json; then
            echo "SELLER_PROMO_KEK already set; not rotating."
          else
            openssl rand -base64 32 | tr -d '\n' | npx --yes wrangler@4.121.0 secret put SELLER_PROMO_KEK --name project-gate-line-bridge > /dev/null
            echo "SELLER_PROMO_KEK created."
          fi
          rm -f secrets.json
