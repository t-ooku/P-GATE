name: One-time dispatch - Runway replacement 2026-09-08

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-runway-replacement-20260908.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Auto Runway reel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run auto-runway-reel.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f slot=wed \
            -f theme=want_at_price
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "[AUTO-DISPATCH] Runway replacement requested 2026-09-08" \
            --body "Auto Runway reel を slot=wed / theme=want_at_price / publish_at=空 で起動しました。dispatch run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
