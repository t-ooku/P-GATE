name: Materialize generated HOSHILU BUZZ reel 2026-09-14

on:
  push:
    branches: [feature/ui-search-v2]
    paths:
      - '.github/workflows/materialize-hoshilu-buzz-reel-20260914.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: materialize-hoshilu-buzz-20260914
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Download verified generation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/10347634965/zip > /tmp/reel.zip
          mkdir -p /tmp/reel
          unzip -q /tmp/reel.zip -d /tmp/reel
          test -s /tmp/reel/reel.mp4
          test -s /tmp/reel/contact-sheet.jpg
          cp /tmp/reel/reel.mp4 tools/line-worker/public/social/hoshilu-buzz-korea-runway-20260914.mp4
          cp /tmp/reel/contact-sheet.jpg tools/line-worker/public/social/runway/hoshilu-buzz-korea-runway-20260914-contact-sheet.jpg
          sed 's#output/reel.mp4#/tmp/reel/reel.mp4#' /tmp/reel/reel.sha256 | sha256sum -c -
      - name: Commit generated media for review
        run: |
          set -euo pipefail
          git config user.name "hoshilu-patch-bot"
          git config user.email "noreply@hoshilu.app"
          git add tools/line-worker/public/social/hoshilu-buzz-korea-runway-20260914.mp4 tools/line-worker/public/social/runway/hoshilu-buzz-korea-runway-20260914-contact-sheet.jpg
          git commit -m "chore(social): add generated HOSHILU BUZZ actress reel candidate"
          git pull --rebase origin feature/ui-search-v2
          git push origin HEAD:refs/heads/feature/ui-search-v2
