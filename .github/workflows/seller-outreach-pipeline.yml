name: Seller outreach pipeline tests (no external sends)
on:
  push:
    branches: [feature/seller-outreach-pipeline-20261106]
    paths:
      - tools/seller-outreach-pipeline/**
      - .github/workflows/seller-outreach-pipeline.yml
  pull_request:
    paths:
      - tools/seller-outreach-pipeline/**
      - .github/workflows/seller-outreach-pipeline.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/seller-outreach-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm test
