name: Generate corrected HOSHILU BUZZ main-actress reel 2026-09-14

on:
  push:
    branches: [feature/ui-search-v2]
    paths:
      - '.github/workflows/generate-hoshilu-buzz-reel-20260914.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runway-hoshilu-buzz-main-actress-20260914
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check Runway credential
        run: test -n "${{ secrets.RUNWAYML_API_SECRET }}"

      - name: Generate moving video from confirmed main actress v1
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p output
          node <<'NODE'
          const fs = require('node:fs');
          async function main() {
          const headers = {
            accept: 'application/json',
            'content-type': 'application/json',
            authorization: `Bearer ${process.env.RUNWAYML_API_SECRET}`,
            'X-Runway-Version': '2024-11-06'
          };
          const body = {
            model: 'gen4_turbo',
            promptImage: 'https://hoshilu.app/social/runway/hoshilu-approved-model-reference-v1.jpg',
            promptText: 'The exact same fictional adult Japanese woman in the source image, with light brown hair, bangs, gold earrings and black patterned blouse, gently smiles, blinks naturally, looks up from her phone toward camera and gestures lightly as if introducing a shopping trend. Preserve her exact facial identity, hair color, bangs, earrings, clothing and background. Natural subtle motion, locked camera, no added text, no logos, no extra people, no face morphing.',
            ratio: '720:1280',
            duration: 10
          };
          const create = await fetch('https://api.dev.runwayml.com/v1/image_to_video', {
            method: 'POST', headers, body: JSON.stringify(body)
          });
          const created = await create.json();
          if (!create.ok || !created.id) throw new Error(`create ${create.status}: ${JSON.stringify(created).slice(0,500)}`);
          fs.writeFileSync('output/task.json', JSON.stringify({id: created.id, model: body.model}, null, 2));
          const deadline = Date.now() + 20 * 60 * 1000;
          while (Date.now() < deadline) {
            await new Promise(r => setTimeout(r, 10000));
            const response = await fetch(`https://api.dev.runwayml.com/v1/tasks/${encodeURIComponent(created.id)}`, {
              headers: {accept:'application/json',authorization:headers.authorization,'X-Runway-Version':'2024-11-06'}
            });
            const task = await response.json();
            if (!response.ok) throw new Error(`poll ${response.status}`);
            if (task.status === 'SUCCEEDED') {
              const url = task.output?.[0];
              if (!url) throw new Error('missing output');
              const media = await fetch(url);
              if (!media.ok) throw new Error(`download ${media.status}`);
              fs.writeFileSync('output/raw.mp4', Buffer.from(await media.arrayBuffer()));
              fs.writeFileSync('output/task-result.json', JSON.stringify({id:created.id,status:task.status}, null, 2));
              process.exit(0);
            }
            if (['FAILED','CANCELLED'].includes(task.status)) throw new Error(`${task.status}: ${task.failureCode||''} ${task.failure||''}`);
          }
          throw new Error('generation timed out');
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Add HOSHILU BUZZ message and pop BGM
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          font=/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
          music=tools/line-worker/public/social/hoshilu-reel-9malls-pop-v1.mp4
          test -f "$music"
          python3 -m pip install -q edge-tts
          edge-tts --voice ja-JP-NanamiNeural --rate=+22% --text '韓国トレンド、今なにが人気？ ホシルバズなら、欲しいものをランキングでチェック。キューテンやシーインの商品もまとめて探せるよ。無料会員なら、テーマが変わった時にお知らせが届くよ。' --write-media output/voice.mp3
          test -s output/voice.mp3
          ffmpeg -y -v error -i output/raw.mp4 -stream_loop -1 -i "$music" -i output/voice.mp3 \
            -filter_complex "[0:v]scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,fps=24,drawtext=fontfile='$font':text='韓国トレンド、いま何が人気？':fontsize=42:fontcolor=white:x=(w-text_w)/2:y=110:box=1:boxcolor=0x111111@0.62:boxborderw=20:enable='between(t,0.2,4.8)',drawtext=fontfile='$font':text='HOSHILU BUZZでランキングをチェック':fontsize=36:fontcolor=white:x=(w-text_w)/2:y=1030:box=1:boxcolor=0x8d2de2@0.72:boxborderw=18:enable='between(t,3.2,8.4)',drawtext=fontfile='$font':text='Qoo10・SHEINもまとめて探せる':fontsize=32:fontcolor=white:x=(w-text_w)/2:y=1100:box=1:boxcolor=0xff4f81@0.75:boxborderw=15:enable='between(t,5.0,9.5)',drawtext=fontfile='$font':text='hoshilu.app/buzz  |  AI生成・AI加工映像':fontsize=24:fontcolor=white:x=(w-text_w)/2:y=1215:box=1:boxcolor=black@0.62:boxborderw=10[v];[1:a]atrim=duration=10,asetpts=PTS-STARTPTS,volume=0.28,afade=t=in:st=0:d=0.2,afade=t=out:st=9.4:d=0.6[bgm];[2:a]atrim=duration=9.7,asetpts=PTS-STARTPTS,adelay=200|200,volume=1.35[voice];[bgm][voice]amix=inputs=2:duration=longest:dropout_transition=0,alimiter=limit=0.92[a]" \
            -map "[v]" -map "[a]" -t 10 -c:v libx264 -preset medium -crf 18 -profile:v high -level:v 4.0 -pix_fmt yuv420p -r 24 -c:a aac -b:a 192k -ar 44100 -ac 2 -movflags +faststart output/reel.mp4
          ffmpeg -v error -i output/reel.mp4 -f null -
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,channels,sample_rate -of json output/reel.mp4 > output/probe.json
          ffmpeg -hide_banner -i output/reel.mp4 -af volumedetect -f null - 2> output/volume.txt
          grep -q 'audio' output/probe.json
          node -e "const p=require('./output/probe.json'); if(!p.streams.some(s=>s.codec_type==='audio'&&Number(s.channels)>=2)) throw Error('missing stereo audio');"
          grep -E 'mean_volume|max_volume' output/volume.txt
          ffmpeg -y -v error -i output/raw.mp4 -vf "fps=1,scale=180:-1,tile=5x2" -frames:v 1 output/contact-sheet.jpg
          sha256sum output/reel.mp4 > output/reel.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: hoshilu-buzz-main-actress-voice-reel-20260914-${{ github.run_id }}
          path: output/
          retention-days: 7
