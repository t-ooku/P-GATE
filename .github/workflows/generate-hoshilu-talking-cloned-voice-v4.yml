name: Generate HOSHILU talking main actress with cloned voice v4

on:
  push:
    branches: [feature/ui-search-v2]
    paths:
      - '.github/workflows/generate-hoshilu-talking-cloned-voice-v4.yml'

permissions:
  contents: read

concurrency:
  group: runway-hoshilu-talking-cloned-voice-v4
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore user-provided successful voice reference
        run: |
          set -euo pipefail
          mkdir -p output
          printf '%s' '' | base64 -d > output/reference-voice.mp3
          test -s output/reference-voice.mp3
          test "$(stat -c %s output/reference-voice.mp3)" -gt 90000
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -v error -stream_loop 1 -i output/reference-voice.mp3 -t 12 -ac 1 -ar 44100 -b:a 128k output/reference-voice-long.mp3
          test -s output/reference-voice-long.mp3

      - name: Isolate reference voice, clone it, and generate synchronized avatar video
        run: |
          set -euo pipefail
          test -n "$RUNWAYML_API_SECRET"
          npm init -y >/dev/null
          npm install --silent @runwayml/sdk@latest
          node <<'NODE'
          const fs = require('node:fs');
          const RunwayML = require('@runwayml/sdk').default;
          const client = new RunwayML({apiKey: process.env.RUNWAYML_API_SECRET});
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          const toData = (mime,path) => `data:${mime};base64,${fs.readFileSync(path).toString('base64')}`;
          async function download(url,path){
            const res=await fetch(url);
            if(!res.ok) throw new Error('download '+res.status);
            fs.writeFileSync(path,Buffer.from(await res.arrayBuffer()));
          }
          async function main(){
            const isolation = await client.voiceIsolation.create({
              model:'eleven_voice_isolation',
              audioUri:toData('audio/mpeg','output/reference-voice-long.mp3')
            }).waitForTaskOutput();
            const isolatedUrl=isolation.output?.[0];
            if(!isolatedUrl) throw new Error('missing isolated voice output');
            await download(isolatedUrl,'output/isolated-reference-voice.mp3');

            const voiceName='HOSHILU Main Actress Voice 20260914 v1';
            let voice=null;
            for await (const item of client.voices.list({limit:100})){
              if(item.name===voiceName){voice=item;break;}
            }
            if(!voice){
              voice=await client.voices.create({
                name:voiceName,
                description:'User-provided approved HOSHILU main-actress Japanese voice reference',
                from:{type:'audio',audio:toData('audio/mpeg','output/isolated-reference-voice.mp3')}
              });
            }
            const voiceDeadline=Date.now()+15*60*1000;
            while(voice.status!=='READY'){
              if(voice.status==='FAILED') throw new Error('voice clone failed: '+JSON.stringify(voice));
              if(Date.now()>voiceDeadline) throw new Error('voice clone timeout');
              await sleep(10000);
              voice=await client.voices.retrieve(voice.id);
              console.log('voice status',voice.status);
            }

            let avatar=null;
            for await (const item of client.avatars.list({limit:100})){
              if(item.name==='HOSHILU Main Actress 20260914' && item.status==='READY'){avatar=item;break;}
            }
            if(!avatar){
              avatar=await client.avatars.create({
                name:'HOSHILU Main Actress 20260914',
                personality:'明るく親しみやすい日本人女性。買い物トレンドを自然な日本語で紹介する。',
                referenceImage:'https://hoshilu.app/social/runway/hoshilu-approved-model-reference-v1.jpg',
                imageProcessing:'optimize',
                voice:{type:'custom',id:voice.id}
              });
              const avatarDeadline=Date.now()+15*60*1000;
              while(avatar.status!=='READY'){
                if(avatar.status==='FAILED') throw new Error('avatar failed: '+JSON.stringify(avatar));
                if(Date.now()>avatarDeadline) throw new Error('avatar timeout');
                await sleep(10000);
                avatar=await client.avatars.retrieve(avatar.id);
                console.log('avatar status',avatar.status);
              }
            }

            const script='韓国トレンド、今なにが人気？ホシルバズなら、ランキングが変わった時にお知らせが届くよ。気になるもの、見つけてね。';
            const task=await client.avatarVideos.create({
              model:'gwm1_avatars',
              avatar:{type:'custom',avatarId:avatar.id},
              speech:{type:'text',text:script,voice:{type:'custom',id:voice.id}}
            }).waitForTaskOutput();
            const url=task.output?.[0];
            if(!url) throw new Error('missing avatar video output');
            await download(url,'output/talking-cloned-raw.mp4');
            fs.writeFileSync('output/generation.json',JSON.stringify({taskId:task.id,status:task.status,avatarId:avatar.id,voiceId:voice.id,script},null,2));
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify spoken voice, add quiet pop BGM, and render review
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          raw=output/talking-cloned-raw.mp4
          music=tools/line-worker/public/social/hoshilu-reel-9malls-pop-v1.mp4
          font=/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
          test -s "$raw"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$raw" | grep -qx audio
          ffmpeg -hide_banner -i "$raw" -af volumedetect -f null - 2> output/raw-voice-volume.txt
          grep -E 'mean_volume|max_volume' output/raw-voice-volume.txt
          mean=$(grep 'mean_volume:' output/raw-voice-volume.txt | tail -1 | awk '{print $5}')
          awk -v m="$mean" 'BEGIN{if(m+0 < -38) exit 1}'
          ffmpeg -y -v error -i "$raw" -stream_loop -1 -i "$music" \
            -filter_complex "[0:v]scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,fps=24,drawtext=fontfile='$font':text='韓国トレンド、いま何が人気？':fontsize=40:fontcolor=white:x=(w-text_w)/2:y=95:box=1:boxcolor=0x111111@0.62:boxborderw=18:enable='between(t,0.1,3.4)',drawtext=fontfile='$font':text='HOSHILU BUZZでランキングをチェック':fontsize=34:fontcolor=white:x=(w-text_w)/2:y=1035:box=1:boxcolor=0x8d2de2@0.74:boxborderw=16:enable='gte(t,2.8)',drawtext=fontfile='$font':text='Qoo10・SHEINもまとめて探せる':fontsize=29:fontcolor=white:x=(w-text_w)/2:y=1105:box=1:boxcolor=0xff4f81@0.76:boxborderw=13:enable='gte(t,4.2)',drawtext=fontfile='$font':text='hoshilu.app/buzz  |  AI生成・AI加工映像':fontsize=23:fontcolor=white:x=(w-text_w)/2:y=1218:box=1:boxcolor=black@0.64:boxborderw=9[v];[0:a]volume=1.30[voice];[1:a]volume=0.10,afade=t=in:st=0:d=0.25[bgm];[voice][bgm]amix=inputs=2:duration=first:dropout_transition=0,alimiter=limit=0.92[a]" \
            -map "[v]" -map "[a]" -shortest -c:v libx264 -preset medium -crf 18 -profile:v high -level:v 4.0 -pix_fmt yuv420p -r 24 -c:a aac -b:a 192k -ar 44100 -ac 2 -movflags +faststart output/review.mp4
          ffmpeg -v error -i output/review.mp4 -f null -
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,channels,sample_rate -of json output/review.mp4 > output/probe.json
          ffmpeg -y -v error -i "$raw" -vf "fps=1,scale=180:-1,tile=5x2" -frames:v 1 output/contact-sheet.jpg
          sha256sum output/review.mp4 > output/review.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: hoshilu-talking-cloned-voice-v4-${{ github.run_id }}
          path: output/
          retention-days: 7
