name: Set Cloudflare Worker secret (manual, from staged GitHub secret)

# Manual-only. Never runs on push.
#
# Usage:
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: STAGING_SECRET_VALUE   Value: <the actual secret value>
#   2. Actions tab -> "Set Cloudflare Worker secret" -> Run workflow.
#      secret_name: the target Worker secret name (e.g. STRIPE_SECRET_KEY)
#      confirm: APPLY
#   3. After it succeeds, delete the STAGING_SECRET_VALUE repository secret.
#   4. Repeat for each secret you need to set.
#
# 2026-09-04: `npx wrangler secret put` hung for 5 minutes in CI (run #1), so this
# now calls the Cloudflare Workers Secrets API directly with curl and checks the
# JSON response. The secret value is never printed.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Worker secret name to set (e.g. STRIPE_SECRET_KEY)'
        required: true
      confirm:
        description: 'Type APPLY to confirm writing this secret to the production Worker'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: cloudflare-worker-secret-set
      cancel-in-progress: false
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "APPLY" ]; then
            echo "::error::confirm input must be exactly APPLY. Nothing was executed."
            exit 1
          fi

      - name: Check required secrets are configured
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID are not set."
            exit 1
          fi
          if [ -z "${{ secrets.STAGING_SECRET_VALUE }}" ]; then
            echo "::error::STAGING_SECRET_VALUE repository secret is not set. Add it first (see workflow comment header)."
            exit 1
          fi

      - name: Set the Worker secret via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_NAME: ${{ github.event.inputs.secret_name }}
          SECRET_VALUE: ${{ secrets.STAGING_SECRET_VALUE }}
          WORKER_NAME: project-gate-line-bridge
        run: |
          set -euo pipefail
          if ! printf '%s' "$SECRET_NAME" | grep -Eq '^[A-Z][A-Z0-9_]{1,63}$'; then
            echo "::error::secret_name must be UPPER_SNAKE_CASE (got: $SECRET_NAME)"
            exit 1
          fi
          body=$(jq -n --arg n "$SECRET_NAME" --arg v "$SECRET_VALUE" '{name:$n, text:$v, type:"secret_text"}')
          response=$(curl -sS --max-time 60 -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$body")
          if [ "$(printf '%s' "$response" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare API rejected the secret write: $(printf '%s' "$response" | jq -c '.errors')"
            exit 1
          fi
          echo "::notice::Secret $SECRET_NAME set on $WORKER_NAME (type: $(printf '%s' "$response" | jq -r '.result.type'))."

      - name: Reminder
        run: |
          echo "::notice::Now delete the STAGING_SECRET_VALUE repository secret (Settings -> Secrets and variables -> Actions) so it isn't left around."
