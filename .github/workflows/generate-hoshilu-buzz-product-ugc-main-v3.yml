name: Generate HOSHILU BUZZ Product UGC main actress preview v3
on:
  push:
    branches: [feature/ui-search-v2]
    paths: ['.github/workflows/generate-hoshilu-buzz-product-ugc-main-v3.yml']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate with the proven Product UGC voice recipe
        run: |
          set -euo pipefail
          test -n "$RUNWAYML_API_SECRET"
          mkdir -p output
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createRunwayProductUgc, getRunwayTask } from './tools/line-worker/src/runway-client.mjs';
          const env={RUNWAYML_API_SECRET:process.env.RUNWAYML_API_SECRET};
          const body={
            characterImage:{uri:'https://hoshilu.app/social/runway/hoshilu-approved-model-reference-v1.jpg'},
            productImage:{uri:'https://hoshilu.app/social/runway/hoshilu-product-screen-v1.jpg'},
            version:'2026-06',
            duration:8,
            ratio:'720:1280',
            audio:true,
            productInfo:'HOSHILU BUZZは、若者向け・韓国関連を含む買い物トレンドのランキングテーマを定期的に更新する。Qoo10、SHEINなど気になる商品の検索につなげる。無料会員はランキングテーマ更新時のお知らせを受け取れる。',
            userConcept:'許諾済みの同じ日本人女性。ライトブラウンの髪、前髪、金色のイヤリング、黒い柄シャツを完全に維持。明るい自然光のリビングでカメラへ向かい、日本語で次のセリフだけを一字一句そのまま話す。「韓国トレンド、今なにが人気？ランキングが変わったら通知も届くよ。気になるもの、見つけてね。」友人へ話すような、若く明るい女性の自然で滑らかな声。落ち着いた間、柔らかい抑揚、軽快だが早口にしない。口の動きを発話へ自然に同期。最後に微笑む。人物を別人に変えない。余計な言葉を加えない。スマートフォンを持たない。画面内の文字、字幕、ロゴを生成しない。'
          };
          const created=await createRunwayProductUgc(env,body);
          fs.writeFileSync('output/task-create.json',JSON.stringify(created,null,2));
          if(!created?.id) throw new Error('missing task id');
          const deadline=Date.now()+25*60*1000;
          while(Date.now()<deadline){
            await new Promise(r=>setTimeout(r,10000));
            const task=await getRunwayTask(env,created.id);
            console.log('task',task.status);
            if(task.status==='SUCCEEDED'){
              const url=task.output?.[0];
              if(!url) throw new Error('missing output');
              const res=await fetch(url);
              if(!res.ok) throw new Error('download '+res.status);
              fs.writeFileSync('output/raw-product-ugc.mp4',Buffer.from(await res.arrayBuffer()));
              fs.writeFileSync('output/task-result.json',JSON.stringify({id:created.id,status:task.status},null,2));
              process.exit(0);
            }
            if(['FAILED','CANCELLED'].includes(task.status)) throw new Error(JSON.stringify(task));
          }
          throw new Error('generation timeout');
          NODE
      - name: Add quiet approved pop BGM and exact text
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          font=/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
          music=tools/line-worker/public/social/hoshilu-reel-9malls-pop-v1.mp4
          raw=output/raw-product-ugc.mp4
          test -s "$raw"
          test -s "$music"
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "$raw" | grep -q audio
          ffmpeg -y -v error -i "$raw" -stream_loop -1 -i "$music" \
            -filter_complex "[0:v]scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,fps=24,drawtext=fontfile='$font':text='韓国トレンド、いま何が人気？':fontsize=40:fontcolor=white:x=(w-text_w)/2:y=95:box=1:boxcolor=0x111111@0.62:boxborderw=18:enable='between(t,0.1,3.2)',drawtext=fontfile='$font':text='HOSHILU BUZZでランキングをチェック':fontsize=34:fontcolor=white:x=(w-text_w)/2:y=1035:box=1:boxcolor=0x8d2de2@0.74:boxborderw=16:enable='gte(t,2.7)',drawtext=fontfile='$font':text='Qoo10・SHEINもまとめて探せる':fontsize=29:fontcolor=white:x=(w-text_w)/2:y=1105:box=1:boxcolor=0xff4f81@0.76:boxborderw=13:enable='gte(t,4.0)',drawtext=fontfile='$font':text='hoshilu.app/buzz  |  AI生成・AI加工映像':fontsize=23:fontcolor=white:x=(w-text_w)/2:y=1218:box=1:boxcolor=black@0.64:boxborderw=9[v];[0:a]volume=1.12[voice];[1:a]atrim=duration=8,asetpts=PTS-STARTPTS,volume=0.13,afade=t=in:st=0:d=0.25,afade=t=out:st=7.5:d=0.5[bgm];[voice][bgm]amix=inputs=2:duration=first:dropout_transition=0,alimiter=limit=0.92[a]" \
            -map "[v]" -map "[a]" -t 8 -c:v libx264 -preset medium -crf 18 -profile:v high -level:v 4.0 -pix_fmt yuv420p -r 24 -c:a aac -b:a 192k -ar 44100 -ac 2 -movflags +faststart output/review.mp4
          ffmpeg -v error -i output/review.mp4 -f null -
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,channels,sample_rate -of json output/review.mp4 > output/probe.json
          node -e "const p=require('./output/probe.json');if(!p.streams.some(s=>s.codec_type==='video')||!p.streams.some(s=>s.codec_type==='audio'&&Number(s.channels)>=2))throw Error('missing AV')"
          ffmpeg -hide_banner -i output/review.mp4 -af volumedetect -f null - 2> output/volume.txt
          grep -E 'mean_volume|max_volume' output/volume.txt
          ffmpeg -y -v error -i "$raw" -vf "fps=1,scale=180:-1,tile=4x2" -frames:v 1 output/contact-sheet.jpg
          sha256sum output/review.mp4 > output/review.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hoshilu-buzz-product-ugc-main-v3-${{ github.run_id }}
          path: output/
          retention-days: 7
