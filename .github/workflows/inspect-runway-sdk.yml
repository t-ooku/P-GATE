name: Inspect Runway SDK avatar video interface
on:
  push:
    branches: [feature/ui-search-v2]
    paths: ['.github/workflows/inspect-runway-sdk.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --silent @runwayml/sdk@latest
          node - <<'NODE'
          const RunwayML=require('@runwayml/sdk').default;
          const c=new RunwayML({apiKey:'placeholder'});
          console.log('CLIENT_KEYS',Object.keys(c).sort());
          for(const k of Object.keys(c).filter(k=>/avatar|character/i.test(k))) {
            console.log('RESOURCE',k,Object.keys(c[k]||{}));
          }
          NODE
          sed -n '1,220p' node_modules/@runwayml/sdk/resources/avatar-videos.d.ts
          line="$(grep -n '^export interface AvatarCreateParams' node_modules/@runwayml/sdk/resources/avatars.d.ts | cut -d: -f1)"
          sed -n "${line},$((line+180))p" node_modules/@runwayml/sdk/resources/avatars.d.ts
