name: Publish generated HOSHILU BUZZ reel 2026-09-14

on:
  push:
    branches: [feature/ui-search-v2]
    paths:
      - '.github/workflows/publish-hoshilu-buzz-reel-20260914.yml'

permissions:
  contents: read

concurrency:
  group: hoshilu-social-publish-20260914
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOCIAL_ADMIN_SECRET: ${{ secrets.SOCIAL_ADMIN_SECRET }}
      IG_POST_ID: hoshilu-runway-buzz-korea-20260914-instagram
      X_POST_ID: hoshilu-runway-buzz-korea-20260914-x
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact generated media and identity evidence
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          media=tools/line-worker/public/social/hoshilu-buzz-korea-runway-20260914.mp4
          test -s "$media"
          test -s tools/line-worker/public/social/runway/hoshilu-buzz-korea-runway-20260914-contact-sheet.jpg
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$media")"
          DURATION="$duration" node -e "const d=Number(process.env.DURATION); if(!(d>=9.9&&d<=10.1)) throw Error('duration='+d)"
          ffmpeg -v error -i "$media" -f null -

      - name: Deploy generated video to hoshilu.app
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          npm ci
          npx --yes wrangler@4.121.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify public video route
        run: |
          set -euo pipefail
          for i in {1..12}; do
            code="$(curl -sS -o /tmp/reel.mp4 -w '%{http_code}' 'https://hoshilu.app/social/hoshilu-buzz-korea-runway-20260914.mp4')"
            if [ "$code" = 200 ] && [ "$(stat -c%s /tmp/reel.mp4)" -gt 100000 ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Queue approved Instagram Reel and X video
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          caption='韓国トレンド、次に欲しくなるものは？ HOSHILU BUZZでランキングをチェック。気になる商品はQoo10・SHEIN・楽天・Amazonへまとめて探せます。無料会員ならBUZZテーマが変わった時のお知らせも受け取れます。※この動画はAI生成・AI加工映像です。 #韓国トレンド #韓国コスメ #Qoo10 #SHEIN #購入品 #HOSHILU'
          link='https://hoshilu.app/buzz?utm_source=social&utm_medium=organic_social&utm_campaign=hoshilu_buzz_korea_20260914&utm_content=runway_generated_reel'
          media='https://hoshilu.app/social/hoshilu-buzz-korea-runway-20260914.mp4'
          now="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          sql="INSERT OR IGNORE INTO social_post_queue (post_id,platform,campaign_id,content_id,caption,link,media_url,scheduled_at,status,affiliate,creative_asset_id,content_format,creative_policy,jst_publish_date,ai_generated,crosspost_group_id,approved_at,created_at,updated_at) VALUES ('$IG_POST_ID','INSTAGRAM','hoshilu-ai-generated-buzz-v1','buzz-korea-runway-20260914','$caption','$link','$media','$now','APPROVED',0,'hoshilu-buzz-korea-runway-20260914','REEL','RUNWAY_GENERATED_APPROVED_PERSONA_V2','2026-09-14',1,'hoshilu-buzz-korea-runway-20260914','$now','$now','$now'); INSERT OR IGNORE INTO social_post_queue (post_id,platform,campaign_id,content_id,caption,link,media_url,scheduled_at,status,affiliate,creative_asset_id,content_format,creative_policy,jst_publish_date,ai_generated,crosspost_group_id,approved_at,created_at,updated_at) VALUES ('$X_POST_ID','X','hoshilu-ai-generated-buzz-v1','buzz-korea-runway-20260914-x','$caption','$link','$media','$now','APPROVED',0,'hoshilu-buzz-korea-runway-20260914','VIDEO','RUNWAY_GENERATED_APPROVED_PERSONA_V2','2026-09-14',1,'hoshilu-buzz-korea-runway-20260914','$now','$now','$now');"
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --command "$sql" --yes
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id,platform,status,media_url FROM social_post_queue WHERE post_id IN ('$IG_POST_ID','$X_POST_ID') ORDER BY platform;" > /tmp/queued.json
          node -e "const d=require('/tmp/queued.json'); const r=d.flatMap(x=>x.results||x.result?.results||[]); if(r.length!==2||r.some(x=>!['APPROVED','PUBLISHED'].includes(x.status))) throw Error(JSON.stringify(r)); console.log(r)"

      - name: Start publication now when admin trigger is available
        run: |
          set -euo pipefail
          if [ -n "$SOCIAL_ADMIN_SECRET" ]; then
            curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $SOCIAL_ADMIN_SECRET" https://hoshilu.app/api/internal/social/run
            sleep 5
            curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $SOCIAL_ADMIN_SECRET" https://hoshilu.app/api/internal/social/run
          else
            echo "::notice::SOCIAL_ADMIN_SECRET is unavailable to Actions; production cron will publish the approved rows."
          fi

      - name: Wait for verified public post URLs
        run: |
          set -euo pipefail
          for i in {1..40}; do
            ig_code="$(curl -sS -o /tmp/ig.json -w '%{http_code}' "https://hoshilu.app/api/social/posts/$IG_POST_ID")"
            x_code="$(curl -sS -o /tmp/x.json -w '%{http_code}' "https://hoshilu.app/api/social/posts/$X_POST_ID")"
            echo "attempt=$i ig=$ig_code x=$x_code"
            if [ "$ig_code" = 200 ] && [ "$x_code" = 200 ]; then
              cat /tmp/ig.json
              cat /tmp/x.json
              exit 0
            fi
            sleep 30
          done
          cat /tmp/ig.json || true
          cat /tmp/x.json || true
          exit 1

          ffmpeg -v error -i tools/line-worker/public/social/hoshilu-buzz-korea-runway-20260914.mp4 -f null -

