name: Deploy HOSHILU Worker to Cloudflare

# feature/ui-search-v2 is the branch that tracks what's actually live on
# hoshilu.app (confirmed 2026-08-06 - main has drifted 51 commits behind and
# has no merge path from this branch). Deploy only from here.
on:
  push:
    branches:
      - feature/ui-search-v2

# Only one deploy in flight at a time; a second push while one is running
# cancels the superseded run rather than racing it.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # README/HOSHILU_AI_SEARCH_V2_SPEC rule: never deploy while tests are
      # red. Runs the same suite as ci.yml (build + full regression,
      # including tools/line-worker) before touching production.
      - name: Run full regression suite
        run: npm test

      - name: Check Cloudflare credentials are configured
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID repository secrets are not set - skipping deploy. See docs/HOSHILU_WORKER_RELEASE_RUNBOOK_2026-07-26.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Deploys the Worker only. D1 migrations and Secret rotation stay
      # manual per docs/HOSHILU_WORKER_RELEASE_RUNBOOK_2026-07-26.md and
      # docs/HOSHILU_COMMAND_GOVERNANCE_2026-08-02.md - both need a backup/
      # verification step and explicit approval that this workflow does not
      # (and must not) perform automatically.
      - name: Deploy Worker
        if: steps.creds.outputs.configured == 'true'
        working-directory: tools/line-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
