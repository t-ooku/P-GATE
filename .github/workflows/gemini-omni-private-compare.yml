name: Private Gemini Omni video comparison

# One-shot, non-public evaluation approved on 2026-08-31.
# The generated clip stays in a short-lived Actions artifact and is never
# written to production D1/R2 or connected to the social publishing queue.
on:
  push:
    branches:
      - codex/gemini-omni-private-compare-20260831
    paths:
      - .github/workflows/gemini-omni-private-compare.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gemini-omni-private-compare-20260831
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require the existing Gemini credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is not available to this private comparison workflow."
            exit 1
          fi

      - name: Generate one private 9:16 comparison clip
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p private-gemini-compare
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const model = 'gemini-omni-1.1-flash';
          const source = 'tools/line-worker/public/social/runway/hoshilu-approved-model-reference-v2.jpg';
          const output = 'private-gemini-compare/gemini-omni-1.1-flash-v2.mp4';
          const prompt = [
            'Create a 3-second vertical social video from this reference image.',
            'The fictional 22-year-old adult AI actress makes one small natural hand gesture',
            'toward her smartphone and smiles, with subtle realistic breathing and stable facial identity.',
            'Keep the bright modern living room, natural daylight, clothing, hands, face, and phone coherent.',
            'No logos, products, text, captions, voice, music, celebrity resemblance, or real-person imitation.',
            'This is a private quality comparison and must not introduce a different person.'
          ].join(' ');

          function videoBlock(payload) {
            for (const step of Array.isArray(payload?.steps) ? payload.steps : []) {
              for (const item of Array.isArray(step?.content) ? step.content : []) {
                if (item?.type === 'video' && item?.mime_type === 'video/mp4' && item?.data) return item;
              }
            }
            return null;
          }

          async function main() {
            const inputBytes = fs.readFileSync(source);
            if (inputBytes.length < 1000 || inputBytes.length > 10 * 1024 * 1024) throw new Error('REFERENCE_IMAGE_SIZE_INVALID');
            const started = Date.now();
            const response = await fetch('https://generativelanguage.googleapis.com/v1beta/interactions', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-goog-api-key': process.env.GEMINI_API_KEY },
              body: JSON.stringify({
                model,
                input: [
                  { type: 'image', data: inputBytes.toString('base64'), mime_type: 'image/jpeg' },
                  { type: 'text', text: prompt }
                ],
                generation_config: { task: 'image_to_video' },
                response_format: { type: 'video', aspect_ratio: '9:16', resolution: '720p' }
              }),
              signal: AbortSignal.timeout(15 * 60 * 1000)
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(`GEMINI_HTTP_${response.status}`);
            const video = videoBlock(payload);
            if (!video) throw new Error('GEMINI_VIDEO_MISSING');
            const bytes = Buffer.from(video.data, 'base64');
            if (bytes.length < 10000 || bytes.length > 50 * 1024 * 1024) throw new Error('GEMINI_VIDEO_SIZE_INVALID');
            fs.writeFileSync(output, bytes);
            fs.writeFileSync('private-gemini-compare/generation.json', JSON.stringify({
              model, source, interaction_id: String(payload.id || ''),
              elapsed_seconds: Math.round((Date.now() - started) / 100) / 10,
              output_bytes: bytes.length, delivery: 'private_artifact_only',
              rights: { fictional_adult: true, approved_reference: true, celebrity_or_real_person: false },
              adoption_decision: 'REVIEW_REQUIRED'
            }, null, 2));
          }
          main().catch((error) => {
            console.error(`::error::${String(error?.message || error)}`);
            process.exit(1);
          });
          NODE

      - name: Compare technical metadata with the existing Runway baseline
        run: |
          set -euo pipefail
          baseline="tools/line-worker/ops/runway/media/reel_20260819_overseas_find_normal.mp4"
          generated="private-gemini-compare/gemini-omni-1.1-flash-v2.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json "$generated" > private-gemini-compare/gemini-ffprobe.json
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json "$baseline" > private-gemini-compare/runway-ffprobe.json
          node <<'NODE'
          const fs = require('node:fs');
          const generation = JSON.parse(fs.readFileSync('private-gemini-compare/generation.json'));
          const gemini = JSON.parse(fs.readFileSync('private-gemini-compare/gemini-ffprobe.json'));
          const runway = JSON.parse(fs.readFileSync('private-gemini-compare/runway-ffprobe.json'));
          const duration = Number(gemini.format?.duration || 0);
          if (!(duration >= 2.5 && duration <= 10.5)) throw new Error(`GEMINI_DURATION_OUT_OF_BOUND:${duration}`);
          const video = (gemini.streams || []).find((stream) => stream.width && stream.height);
          if (!video || video.height <= video.width) throw new Error('GEMINI_NOT_PORTRAIT');
          const estimate = Math.round(duration * 0.10 * 100) / 100;
          const report = {
            generated_at: new Date().toISOString(),
            private_only: true,
            public_or_social_publish: false,
            gemini: { ...generation, ffprobe: gemini, estimated_usd_at_720p: estimate },
            runway_baseline: { file: 'reel_20260819_overseas_find_normal.mp4', ffprobe: runway },
            human_review_required: ['identity consistency','hands and phone','motion naturalness','9:16 framing','audio and rights'],
            adoption_rule: 'Do not adopt unless quality, elapsed time, estimated cost, and rights review all beat the current Runway fallback.'
          };
          fs.writeFileSync('private-gemini-compare/comparison.json', JSON.stringify(report, null, 2));
          console.log(`::notice::private clip ready: duration=${duration}s estimated_cost_usd=${estimate} decision=REVIEW_REQUIRED`);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: private-gemini-omni-compare-${{ github.run_id }}
          path: private-gemini-compare/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
