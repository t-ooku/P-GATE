name: Build social reel (ffmpeg) and deploy

# 2026-09-04 大隆さん指示（希望価格ウォッチ推しリール）。動画はバイナリなので Issue パッチ
# 経由で置けない。scripts/build-watch-reel.py を push すると、このワークフローが ubuntu の
# ffmpeg + Noto CJK で MP4 を再生成し、feature/ui-search-v2 にコミットして Worker を
# デプロイする（assets として hoshilu.app/social/ から配信）。Runway 課金は発生しない。

on:
  push:
    branches: [feature/ui-search-v2]
    paths:
      - 'tools/line-worker/scripts/build-watch-reel.py'
      - '.github/workflows/build-social-reel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg, Noto CJK font and Pillow
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk python3-pil
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc

      - name: Build the reel
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          python3 scripts/build-watch-reel.py /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
          ffprobe -v error -show_entries format=duration:stream=width,height -of default=nw=1 public/social/hoshilu-ai-actress-watch-v1.mp4
          ls -la public/social/hoshilu-ai-actress-watch-v1.mp4

      - name: Commit the reel
        id: commit
        run: |
          set -euo pipefail
          git config user.name "hoshilu-patch-bot"
          git config user.email "noreply@hoshilu.app"
          git add tools/line-worker/public/social/hoshilu-ai-actress-watch-v1.mp4
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "reel unchanged"
          else
            git commit -m "chore(social): 希望価格ウォッチ推しリール（AI女優v1）を ffmpeg で再生成 [reel-build]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker

      - name: Validate exact production Worker bundle and bindings
        working-directory: tools/line-worker
        run: npx --yes wrangler@4.121.0 deploy --dry-run --outdir /tmp/hoshilu-worker-dry-run

      - name: Run all regression tests
        run: npm test

      - name: Push to production branch
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git pull --rebase origin feature/ui-search-v2
          git push origin HEAD:refs/heads/feature/ui-search-v2

      - name: Deploy Worker
        working-directory: tools/line-worker
        run: npx --yes wrangler@4.121.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health
        working-directory: tools/line-worker
        run: node scripts/check-production-health.mjs --attempts 6 --retry-ms 10000

      - name: Verify the reel is served
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' -I https://hoshilu.app/social/hoshilu-ai-actress-watch-v1.mp4)"
          echo "GET /social/hoshilu-ai-actress-watch-v1.mp4 -> $code"
          test "$code" = "200"
