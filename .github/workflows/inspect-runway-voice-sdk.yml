name: Inspect Runway custom voice interfaces
on:
  push:
    branches: [feature/ui-search-v2]
    paths: ['.github/workflows/inspect-runway-voice-sdk.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --silent @runwayml/sdk@latest
          sed -n '1,340p' node_modules/@runwayml/sdk/resources/voices.d.ts
          sed -n '1,300p' node_modules/@runwayml/sdk/resources/speech-to-speech.d.ts
          sed -n '1,260p' node_modules/@runwayml/sdk/resources/text-to-speech.d.ts
