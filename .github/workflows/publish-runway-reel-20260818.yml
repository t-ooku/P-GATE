name: Publish Runway reel 20260818 recommend-voice

# 手動実行専用。AI女優リール第2弾(job: runway-hoshilu-recommend-voice-20260818-v1)の
# 「再公開(repost)」を行う。
#
# 経緯: 初回公開(post v1, external_post_id=17902541781477801)は、一部フレームで
# 合成画面がスマホの左下からはみ出す不具合が残っており、大隆さんがInstagram上の
# 投稿を削除した。レンダラーのベゼル検出を修正した新しい後処理版
# (sha256=df4088af..., 全121差し替えフレームを目視再確認済み)を、同じジョブの
# メディアとして差し替え、新しいpost_id (v2) で公開をやり直す。
#
# 公開するバイト列は、大隆さんが実際に再生して確認した
# ops/runway/media/reel_20260818_recommend_voice_v5.mp4 そのものをアップロードする。
# CI内で再レンダリングはしない(確認した映像と1バイトも違わない保証のため)。
# レンダラーと追跡データは ops/runway/render_reel_20260818_recommend_voice.py /
# reel_screen_track_20260818_recommend_voice.json に固定してある。
#
# 安全弁:
#  - confirm に PUBLISH の入力必須
#  - 公開キューを APPROVED にする最終段は release に RELEASE を追加入力しない限り実行しない
#  - 書き込み前に読み取り専用プリフライト(v1が「公開済み・削除済み」の想定状態で
#    あること、資格情報、競合投稿の不在を確認)
#  - R2アップロード後に往復ダウンロードでバイト一致を確認してからD1を触る
#  - D1のtime-travelブックマークを書き込み前に記録する

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to upload the corrected media and stage the repost'
        required: true
        default: ''
      release:
        description: 'Type RELEASE to also queue it for Instagram publication (leave empty to stop after staging)'
        required: false
        default: ''

permissions:
  contents: read

env:
  JOB_ID: runway-hoshilu-recommend-voice-20260818-v1
  POST_ID: hoshilu-runway-recommend-voice-20260818-v2
  OLD_POST_ID: hoshilu-runway-recommend-voice-20260818-v1
  OLD_EXTERNAL_POST_ID: '17902541781477801'
  MEDIA_SHA256: df4088af79c3ce7a3dd72ccc53448f1db07cf3f9b8610b9496e0005e374b1c5c
  MEDIA_SIZE: '2878075'
  MEDIA_FILE: ops/runway/media/reel_20260818_recommend_voice_v5.mp4
  BUCKET: hoshilu-social-media

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: runway-reel-publish
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "PUBLISH" ]; then
            echo "::error::confirm input must be exactly PUBLISH. Nothing was executed."
            exit 1
          fi
          if [ -n "${{ github.event.inputs.release }}" ] && [ "${{ github.event.inputs.release }}" != "RELEASE" ]; then
            echo "::error::release input must be empty or exactly RELEASE."
            exit 1
          fi
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the reviewed media file
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          echo "${MEDIA_SHA256}  ${MEDIA_FILE}" | sha256sum -c -
          actual_size="$(stat -c%s "${MEDIA_FILE}")"
          test "${actual_size}" = "${MEDIA_SIZE}"
          ffprobe -v error -show_entries stream=codec_type,codec_name,profile,width,height,pix_fmt,r_frame_rate,sample_rate,channels -of json "${MEDIA_FILE}" > media-probe.json
          ffprobe -v error -show_entries format=duration -of csv=p=0 "${MEDIA_FILE}" > media-duration.txt
          node <<'NODE'
          const fs = require('node:fs');
          const streams = JSON.parse(fs.readFileSync('media-probe.json', 'utf8')).streams || [];
          const video = streams.find((s) => s.codec_type === 'video');
          const audio = streams.find((s) => s.codec_type === 'audio');
          const problems = [];
          if (streams.length !== 2) problems.push(`stream count ${streams.length}`);
          if (!video || video.codec_name !== 'h264' || video.profile !== 'High') problems.push('video codec/profile');
          if (!video || video.width !== 720 || video.height !== 1280) problems.push('resolution');
          if (!video || video.pix_fmt !== 'yuv420p' || video.r_frame_rate !== '24/1') problems.push('pix_fmt/frame rate');
          if (!audio || audio.codec_name !== 'aac' || Number(audio.sample_rate) !== 44100 || Number(audio.channels) !== 2) problems.push('audio');
          const duration = Number(fs.readFileSync('media-duration.txt', 'utf8').trim());
          if (!(duration > 7.9 && duration < 8.2)) problems.push(`duration ${duration}`);
          if (problems.length) throw new Error(problems.join(' / '));
          console.log(`::notice::reviewed media verified: h264 High 720x1280 24fps + aac 44100 stereo, ${duration}s`);
          NODE
          # 動画が実際に最後までデコードできること(コンテナだけ正しい破損ファイルを弾く)
          ffmpeg -v error -i "${MEDIA_FILE}" -f null -

      - name: Read production state before any write
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error 'https://hoshilu.app/health?runway-reel-repost=1' > reel-health.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command \
            "SELECT job_id,post_id,status,qa_status,storage_key,storage_size_bytes,storage_content_type,rights_confirmed,ai_disclosure_confirmed FROM runway_generation_jobs WHERE job_id='${JOB_ID}';" > reel-job.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command \
            "SELECT post_id,status,external_post_id,platform_job_id,published_at FROM social_post_queue WHERE post_id IN ('${OLD_POST_ID}','${POST_ID}');" > reel-queue.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command \
            "SELECT (SELECT COUNT(*) FROM social_post_queue WHERE post_id NOT IN ('${OLD_POST_ID}','${POST_ID}') AND platform='INSTAGRAM' AND (content_id='${JOB_ID}' OR media_url='https://hoshilu.app/api/social/media/runway/${JOB_ID}.mp4') AND (status IN ('APPROVED','PUBLISHING','PUBLISHED') OR external_post_id<>'' OR platform_job_id<>'')) AS duplicate_count,(SELECT COUNT(*) FROM social_post_queue WHERE post_id NOT IN ('${OLD_POST_ID}','${POST_ID}') AND platform='INSTAGRAM' AND status IN ('APPROVED','PUBLISHING') AND scheduled_at<=strftime('%Y-%m-%dT%H:%M:%fZ','now')) AS competing_due_count;" > reel-collision.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command \
            "SELECT account_id,scopes,expires_at,status FROM instagram_oauth_credentials WHERE platform='INSTAGRAM';" > reel-credential.json
          node <<'NODE'
          const fs = require('node:fs');
          const rows = (f) => { const d = JSON.parse(fs.readFileSync(f, 'utf8'));
            return (Array.isArray(d) ? d : [d]).flatMap((x) => x.results || x.result?.results || []); };
          const one = (f, label) => { const r = rows(f); if (r.length !== 1) throw new Error(`${label}: ${r.length} rows`); return r[0]; };
          const job = one('reel-job.json', 'job');
          const queueRows = rows('reel-queue.json');
          const collision = one('reel-collision.json', 'collision');
          const oauth = one('reel-credential.json', 'instagram credential');
          const health = JSON.parse(fs.readFileSync('reel-health.json', 'utf8'));
          const fail = [];
          if (health?.ok !== true) fail.push('health not ok');
          if (health?.checks?.social_publishers?.INSTAGRAM !== true) fail.push('instagram publisher not ready');
          if (job.status !== 'APPROVED_FOR_POST' || job.qa_status !== 'PASSED') fail.push(`job state ${job.status}/${job.qa_status}`);
          if (Number(job.rights_confirmed) !== 1 || Number(job.ai_disclosure_confirmed) !== 1) fail.push('rights/ai disclosure flags');
          const v1 = queueRows.find((r) => r.post_id === process.env.OLD_POST_ID);
          if (!v1 || v1.status !== 'PUBLISHED' || v1.external_post_id !== process.env.OLD_EXTERNAL_POST_ID) {
            fail.push(`v1 row not in the expected published-then-deleted state: ${JSON.stringify(v1 || null)}`);
          }
          const v2 = queueRows.find((r) => r.post_id === process.env.POST_ID);
          if (v2 && v2.status !== 'REVIEW_REQUIRED') fail.push(`v2 row already progressed: ${v2.status}`);
          if (v2 && (String(v2.external_post_id || '') || String(v2.platform_job_id || '') || String(v2.published_at || ''))) fail.push('v2 row has publication state');
          if (Number(collision.duplicate_count) !== 0) fail.push('duplicate publication exists');
          if (Number(collision.competing_due_count) !== 0) fail.push('another Instagram post is already due');
          if (oauth.status !== 'ACTIVE') fail.push('instagram credential not active');
          if (!String(oauth.scopes || '').split(',').map((s) => s.trim()).includes('instagram_business_content_publish')) fail.push('publish scope missing');
          if (!Number.isFinite(Date.parse(oauth.expires_at)) || Date.parse(oauth.expires_at) <= Date.now() + 5 * 60 * 1000) fail.push('instagram credential expiring');
          if (fail.length) throw new Error(fail.join(' / '));
          console.error(`::notice::PREFLIGHT job=${job.status}/${job.qa_status} v1=PUBLISHED(deleted on IG) v2=${v2 ? v2.status : 'absent'} duplicate=0 competing_due=0`);
          NODE

      - name: Capture a D1 restore point
        working-directory: tools/line-worker
        run: npx --yes wrangler@4.121.0 d1 time-travel info PRODUCT_DB --json > reel-recovery-bookmark.json

      - name: Upload the corrected media to R2 and verify the round trip
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          key="runway/${JOB_ID}/postprocessed-${MEDIA_SHA256}.mp4"
          npx --yes wrangler@4.121.0 r2 object put "${BUCKET}/${key}" \
            --file "${MEDIA_FILE}" --content-type video/mp4 --remote
          npx --yes wrangler@4.121.0 r2 object get "${BUCKET}/${key}" --file roundtrip.mp4 --remote
          cmp "${MEDIA_FILE}" roundtrip.mp4
          echo "::notice::R2 object ${key} matches the reviewed file byte for byte"

      - name: Stage the corrected bytes and the v2 queue row
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json \
            --file ops/runway/stage_reel_20260818_recommend_voice_repost.sql --yes > reel-stage-result.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command \
            "SELECT j.storage_key,j.storage_etag,j.storage_size_bytes,j.storage_content_type,j.status,j.qa_status,q.status AS v2_status,q.caption AS v2_caption,q.affiliate AS v2_affiliate,(SELECT COUNT(*) FROM runway_audit_log WHERE audit_id='runway-recommend-voice-qa-approved-20260819-v2') AS qa_audit,(SELECT COUNT(*) FROM runway_audit_log WHERE audit_id='runway-recommend-voice-ig-deleted-20260819') AS del_audit FROM runway_generation_jobs j LEFT JOIN social_post_queue q ON q.post_id='${POST_ID}' WHERE j.job_id='${JOB_ID}';" > reel-staged-state.json
          MEDIA_SHA256="${MEDIA_SHA256}" MEDIA_SIZE="${MEDIA_SIZE}" JOB_ID="${JOB_ID}" node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('reel-staged-state.json', 'utf8'));
          const rows = (Array.isArray(data) ? data : [data]).flatMap((x) => x.results || x.result?.results || []);
          if (rows.length !== 1) throw new Error(`expected 1 joined row, got ${rows.length}`);
          const row = rows[0];
          const expectedKey = `runway/${process.env.JOB_ID}/postprocessed-${process.env.MEDIA_SHA256}.mp4`;
          const problems = [];
          if (row.storage_key !== expectedKey) problems.push(`storage_key=${row.storage_key}`);
          if (Number(row.storage_size_bytes) !== Number(process.env.MEDIA_SIZE)) problems.push(`size=${row.storage_size_bytes}`);
          if (row.storage_content_type !== 'video/mp4') problems.push(`content_type=${row.storage_content_type}`);
          if (row.storage_etag !== null) problems.push('storage_etag must be SQL NULL');
          if (row.status !== 'APPROVED_FOR_POST' || row.qa_status !== 'PASSED') problems.push(`job moved to ${row.status}/${row.qa_status}`);
          if (row.v2_status !== 'REVIEW_REQUIRED') problems.push(`v2 queue status=${row.v2_status}`);
          if (Number(row.v2_affiliate) !== 0) problems.push('v2 affiliate flag');
          if (!String(row.v2_caption || '').includes('AI生成')) problems.push('v2 caption lacks the AI disclosure');
          if (Number(row.qa_audit) !== 1) problems.push('v2 QA audit row missing');
          if (Number(row.del_audit) !== 1) problems.push('IG deletion audit row missing');
          if (problems.length) throw new Error(problems.join(' / '));
          console.log('::notice::staged: the job now serves the corrected bytes; v2 queue row is REVIEW_REQUIRED; deletion and QA audits recorded');
          NODE

      - name: Verify the media route serves exactly the corrected bytes
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          # 経路上のキャッシュではなく、いま配信される実体を確認する。
          url="https://hoshilu.app/api/social/media/runway/${JOB_ID}.mp4?repost-check=${{ github.run_id }}"
          curl --fail-with-body --silent --show-error --dump-header route-headers.txt --output route-body.mp4 "$url"
          grep -iq '^content-type: video/mp4' route-headers.txt
          echo "${MEDIA_SHA256}  route-body.mp4" | sha256sum -c -
          curl --fail-with-body --silent --show-error --header 'range: bytes=0-99' \
            --dump-header route-range-headers.txt --output route-range.bin "$url"
          grep -iq '^HTTP/.* 206' route-range-headers.txt
          test "$(stat -c%s route-range.bin)" = "100"
          echo "::notice::the media route returns the corrected bytes and supports range requests"

      - name: Release for Instagram publication
        if: github.event.inputs.release == 'RELEASE'
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json \
            --file ops/runway/release_reel_20260818_recommend_voice_repost.sql --yes > reel-release-result.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command \
            "SELECT status,scheduled_at,approved_at,last_error FROM social_post_queue WHERE post_id='${POST_ID}';" > reel-released-state.json
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('reel-released-state.json', 'utf8'));
          const rows = (Array.isArray(data) ? data : [data]).flatMap((x) => x.results || x.result?.results || []);
          if (rows.length !== 1) throw new Error(`expected 1 queue row, got ${rows.length}`);
          const row = rows[0];
          if (!['APPROVED', 'PUBLISHING', 'PUBLISHED'].includes(row.status)) {
            throw new Error(`queue status=${row.status}, expected APPROVED`);
          }
          if (!Number.isFinite(Date.parse(row.approved_at))) throw new Error('approved_at was not set');
          if (String(row.last_error || '')) throw new Error(`queue carries an error: ${row.last_error}`);
          console.log(`::notice::queued for Instagram (status=${row.status}, scheduled_at=${row.scheduled_at}) - the existing publisher cron will post it`);
          NODE

      - name: Report the final state
        if: always()
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command \
            "SELECT j.status AS job_status,j.qa_status,q.post_id,q.status AS queue_status,q.scheduled_at,q.external_post_id,q.published_at,q.last_error FROM runway_generation_jobs j LEFT JOIN social_post_queue q ON q.post_id='${POST_ID}' WHERE j.job_id='${JOB_ID}';" > reel-final-state.json
          node -e "
          const d=require('./reel-final-state.json');
          const r=(Array.isArray(d)?d:[d]).flatMap(x=>x.results||x.result?.results||[])[0]||{};
          console.log('::notice::FINAL job='+r.job_status+'/'+r.qa_status+' v2_queue='+r.queue_status+' scheduled_at='+(r.scheduled_at||'')+' external_post_id='+(r.external_post_id||'')+' published_at='+(r.published_at||'')+' last_error='+(r.last_error||''));
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runway-reel-repost-evidence-${{ github.run_id }}
          path: |
            tools/line-worker/reel-*.json
            tools/line-worker/route-headers.txt
            tools/line-worker/route-range-headers.txt
          retention-days: 30
