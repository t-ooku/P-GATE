name: Inspect Runway dialogue video interfaces
on:
  push:
    branches: [feature/ui-search-v2]
    paths: ['.github/workflows/inspect-runway-dialogue-video.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --silent @runwayml/sdk@latest
          f=node_modules/@runwayml/sdk/resources/avatars.d.ts
          line=$(grep -n '^export interface AvatarCreateParams' "$f" | cut -d: -f1)
          tail -n +"$line" "$f" | sed -n '1,260p'
