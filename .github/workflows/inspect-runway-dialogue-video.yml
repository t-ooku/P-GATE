name: Inspect Runway dialogue video interfaces
on:
  push:
    branches: [feature/ui-search-v2]
    paths: ['.github/workflows/inspect-runway-dialogue-video.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --silent @runwayml/sdk@latest
          for f in node_modules/@runwayml/sdk/resources/voice-isolation.d.ts node_modules/@runwayml/sdk/resources/voices.d.ts node_modules/@runwayml/sdk/resources/avatars.d.ts node_modules/@runwayml/sdk/resources/avatar-videos.d.ts; do
            echo "FILE:$f"
            sed -n '1,900p' "$f"
          done
