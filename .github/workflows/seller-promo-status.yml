name: Seller promo status (read-only, manual)

# 一時版（作業用ブランチ限定・feature/ui-search-v2 にはマージしない）。読み取りのみ。
# 2026-10-19: 案内記録にアドレス・本文が入っていないことの確認と、Instagram の連携権限・インサイト行の確認。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only checks
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          q() { npx --yes wrangler@4.121.0 d1 execute hoshilu-products --remote --command "$1"; }
          q "SELECT substr(sent_at,1,10) AS day,count(*) AS n,sum(contact_email<>'') AS with_email,sum(body<>'') AS with_body,sum(length(email_hash)=64) AS hashed FROM seller_outreach_contacts WHERE channel='GMAIL_MANUAL' GROUP BY day"
          q "SELECT platform,scopes,status,expires_at,last_refreshed_at FROM instagram_oauth_credentials"
          q "SELECT p.platform,count(*) AS rows_n,sum(p.reach IS NOT NULL) AS with_reach,max(p.snapshot_at) AS last_snap FROM social_post_performance p WHERE p.snapshot_at>='2026-10-01' GROUP BY p.platform"
          q "SELECT q.campaign_id,count(*) AS n FROM social_post_queue q WHERE q.platform='INSTAGRAM' AND q.status='PUBLISHED' AND q.published_at>='2026-10-01' GROUP BY q.campaign_id"
