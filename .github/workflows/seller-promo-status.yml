name: Seller promo status (read-only, manual)

# 一時版（作業用ブランチ限定・feature/ui-search-v2 にはマージしない）。読み取りのみ。
# 2026-10-30: 木曜 20:00（10/29）の投稿が出たかの確認。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only checks
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          q() { npx --yes wrangler@4.121.0 d1 execute hoshilu-products --remote --command "$1"; }
          q "SELECT platform,campaign_id,status,strftime('%m-%d %H:%M',scheduled_at,'+9 hours') AS jst,strftime('%H:%M',published_at,'+9 hours') AS pub,substr(last_error,1,80) AS err FROM social_post_queue WHERE scheduled_at>='2026-10-29T09:00:00Z' AND scheduled_at<'2026-10-29T15:00:00Z' ORDER BY scheduled_at,platform"
