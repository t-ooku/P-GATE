name: Activate Google visual web search

# Production-only release gate for the optional Cloud Vision WEB_DETECTION
# path. It runs only for the explicitly approved commit marker, applies only
# migration 0062, and refuses to activate without the dedicated API key.
on:
  push:
    branches:
      - feature/ui-search-v2

permissions:
  contents: read

jobs:
  prepare-d1:
    if: contains(github.event.head_commit.message, '[activate-google-visual-search-approved]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-d1-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify approval, credentials, migration and hard cap
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(sha256sum migrations/0062_google_visual_web_detection_budget.sql | cut -d' ' -f1)" = "291f2f55421137debb23a65f8f15293c29c335deecbf69a98355c5d80aa505f6"
          if grep -iqE '(^|[[:space:]])(delete|drop|truncate|alter)[[:space:]]' migrations/0062_google_visual_web_detection_budget.sql; then
            echo "::error::Destructive statement found in 0062"
            exit 1
          fi
          grep -Fq '"GOOGLE_VISUAL_SEARCH_ENABLED": "true"' wrangler.jsonc
          grep -Fq '"GOOGLE_VISUAL_SEARCH_MONTHLY_REQUEST_LIMIT": "900"' wrangler.jsonc
      - name: Capture restore point and prepare isolated migration
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 time-travel info PRODUCT_DB --json > google-visual-recovery-bookmark-before.json
          mkdir -p .migration-google-visual-0062
          cp migrations/0062_google_visual_web_detection_budget.sql .migration-google-visual-0062/0062_google_visual_web_detection_budget.sql
          cat > wrangler-google-visual-0062.jsonc <<'JSON'
          {
            "name": "project-gate-line-bridge",
            "main": "src/index.mjs",
            "compatibility_date": "2026-07-14",
            "d1_databases": [{
              "binding": "PRODUCT_DB",
              "database_name": "hoshilu-products",
              "database_id": "17629324-b771-4348-982c-c25da48c29b2",
              "migrations_dir": ".migration-google-visual-0062"
            }]
          }
          JSON
          npx --yes wrangler@4.121.0 d1 migrations list PRODUCT_DB --remote --config wrangler-google-visual-0062.jsonc > google-visual-pending-before.txt
      - name: Apply only migration 0062 and verify schema
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 migrations apply PRODUCT_DB --remote --config wrangler-google-visual-0062.jsonc
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command \
            "SELECT COUNT(*) AS table_count FROM sqlite_master WHERE type='table' AND name='google_visual_web_detection_usage_monthly';" \
            > google-visual-table-after.json
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('google-visual-table-after.json'));
          const rows = (Array.isArray(data) ? data : [data]).flatMap((entry) => entry.results || entry.result?.results || []);
          if (Number(rows[0]?.table_count) !== 1) throw new Error(JSON.stringify(rows));
          console.log('::notice::GOOGLE_VISUAL_D1_READY monthly_limit=900');
          NODE
          npx --yes wrangler@4.121.0 d1 migrations list PRODUCT_DB --remote --config wrangler-google-visual-0062.jsonc > google-visual-pending-after.txt
          if grep -Fq '0062_google_visual_web_detection_budget.sql' google-visual-pending-after.txt; then
            echo "::error::0062 is still pending"
            exit 1
          fi
      - name: Preserve migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-visual-d1-${{ github.run_id }}
          path: |
            tools/line-worker/google-visual-recovery-bookmark-before.json
            tools/line-worker/google-visual-pending-before.txt
            tools/line-worker/google-visual-pending-after.txt
            tools/line-worker/google-visual-table-after.json
          retention-days: 30

  activate:
    needs: prepare-d1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require dedicated provider key and Cloudflare credentials
        env:
          GOOGLE_CLOUD_VISION_API_KEY: ${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_CLOUD_VISION_API_KEY" || { echo "::error::GOOGLE_CLOUD_VISION_API_KEY repository secret is required"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Set Worker secret without exposing it
        working-directory: tools/line-worker
        env:
          GOOGLE_CLOUD_VISION_API_KEY: ${{ secrets.GOOGLE_CLOUD_VISION_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$GOOGLE_CLOUD_VISION_API_KEY" | npx --yes wrangler@4.121.0 secret put GOOGLE_CLOUD_VISION_API_KEY --name project-gate-line-bridge
      - name: Deploy enabled Worker
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.121.0 deploy
      - name: Verify both production health gates
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if health="$(curl --fail-with-body --silent --show-error 'https://hoshilu.app/health?google-visual=1')" && \
              HEALTH="$health" node <<'NODE'
          const health = JSON.parse(process.env.HEALTH);
          const checks = health?.checks || {};
          const database = checks.database_features || {};
          if (health.ok !== true || checks.google_visual_web_detection_configured !== true || checks.google_visual_web_detection_budget_ready !== true || database.google_visual_web_detection_usage_monthly !== true) {
            throw new Error(JSON.stringify({ ok: health.ok, configured: checks.google_visual_web_detection_configured, budget: checks.google_visual_web_detection_budget_ready, table: database.google_visual_web_detection_usage_monthly }));
          }
          NODE
            then
              echo "::notice::GOOGLE_VISUAL_SEARCH_ACTIVE monthly_limit=900"
              exit 0
            fi
            sleep 10
          done
          echo "::error::production health gates did not become ready"
          exit 1
