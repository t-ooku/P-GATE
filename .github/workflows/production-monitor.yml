name: HOSHILU production monitor

on:
  # Offset from the top of the hour to reduce GitHub scheduler congestion.
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  # The workflow must also live on GitHub's default branch (main). This trigger
  # gives the first installation an immediate run instead of waiting for cron.
  push:
    branches: [main]
    paths: ['.github/workflows/production-monitor.yml']

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: hoshilu-production-monitor
  # A delayed run must finish and persist its result. Cancelling it every five
  # minutes could keep refreshing STARTED without ever reaching COMPLETED.
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-search-v2
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record production source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Bootstrap schedule heartbeat on workflow installation
        id: heartbeat_bootstrap
        if: github.event_name == 'push'
        continue-on-error: true
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/production-monitor-control.mjs heartbeat --status BOOTSTRAP --run-id "$GITHUB_RUN_ID"

      - name: Record scheduled monitor start
        id: heartbeat_start
        if: github.event_name == 'schedule'
        continue-on-error: true
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/production-monitor-control.mjs heartbeat --status STARTED --run-id "$GITHUB_RUN_ID"

      - name: Check public health, live assets and critical contracts
        id: external
        continue-on-error: true
        working-directory: tools/line-worker
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-production-health.mjs \
            --asset-policy live --attempts 3 --retry-ms 5000 --deadline-ms 90000 \
            2>&1 | tee /tmp/hoshilu-external-monitor.log

      - name: Check anonymous real-user search SLI
        id: sli
        continue-on-error: true
        timeout-minutes: 2
        working-directory: tools/line-worker
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          node scripts/check-production-search-sli.mjs \
            --window-minutes 15 --max-hard-failures 0 \
            --max-backend-failures 0 \
            --degraded-minimum 3 --degraded-rate-limit 0.2 \
            --slo-window-minutes 360 --slo-minimum-finished 100 \
            --slo-degraded-rate-limit 0.01 \
            --monthly-minimum-finished 1000 \
            --monthly-unavailable-rate-limit 0.0005 \
            --pending-output /tmp/hoshilu-pending-incidents.json \
            --attempts 3 --retry-ms 5000 \
            2>&1 | tee /tmp/hoshilu-search-sli.log

      - name: Reconcile production incident
        id: incident
        if: always()
        uses: actions/github-script@v7
        env:
          EXTERNAL_OUTCOME: ${{ steps.external.outcome }}
          SLI_OUTCOME: ${{ steps.sli.outcome }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const title = '[AUTO][HOSHILU] Production reliability incident';
            const readLog = (path) => {
              if (!fs.existsSync(path)) return '(step did not produce a log)';
              return fs.readFileSync(path, 'utf8')
                .replace(/Bearer\s+\S+/gi, 'Bearer [REDACTED]')
                .slice(-3000);
            };
            const externalFailed = process.env.EXTERNAL_OUTCOME !== 'success';
            const sliFailed = process.env.SLI_OUTCOME !== 'success';
            const failed = externalFailed || sliFailed;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();

            if (failed) {
              const first = existing?.body?.match(/First detected: `([^`]+)`/)?.[1] || now;
              const body = [
                '<!-- hoshilu-production-monitor -->',
                'This incident was opened automatically. Search text and personal data are not recorded.',
                '',
                `- First detected: \`${first}\``,
                `- Last detected: \`${now}\``,
                `- External contract check: **${externalFailed ? 'FAIL' : 'PASS'}**`,
                `- Real-user search SLI: **${sliFailed ? 'FAIL' : 'PASS'}**`,
                `- Production source: \`${process.env.SOURCE_SHA || 'unknown'}\``,
                `- Workflow run: ${runUrl}`,
                '',
                '<details><summary>Sanitized external check</summary>',
                '', '```text', readLog('/tmp/hoshilu-external-monitor.log'), '```', '</details>',
                '',
                '<details><summary>Sanitized real-user SLI check</summary>',
                '', '```text', readLog('/tmp/hoshilu-search-sli.log'), '```', '</details>'
              ].join('\n');
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({
                  owner, repo, title, body, assignees: [owner]
                });
              }
              core.setOutput('recorded', 'true');
              return;
            }

            if (!existing) return;
            const { hasThreeConsecutivePostIncidentSuccesses } = await import(
              `${process.env.GITHUB_WORKSPACE}/tools/line-worker/scripts/production-monitor-recovery.mjs`
            );
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'production-monitor.yml', branch: 'main',
              status: 'completed', per_page: 10
            });
            if (!hasThreeConsecutivePostIncidentSuccesses(
              runs.data.workflow_runs, context.runId, existing.body
            )) return;
            await github.rest.issues.createComment({
              owner, repo, issue_number: existing.number,
              body: `Recovered after three consecutive successful checks. Last verification: ${runUrl}`
            });
            await github.rest.issues.update({
              owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed'
            });

      - name: Acknowledge persisted reliability incidents after GitHub records them
        if: always() && steps.incident.outputs.recorded == 'true'
        continue-on-error: true
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -f /tmp/hoshilu-pending-incidents.json ]]; then
            node scripts/production-monitor-control.mjs ack --file /tmp/hoshilu-pending-incidents.json
          fi

      - name: Record scheduled monitor completion
        id: heartbeat_complete
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/production-monitor-control.mjs heartbeat --status COMPLETED --run-id "$GITHUB_RUN_ID"

      - name: Mark monitor run failed
        if: always() && (steps.external.outcome != 'success' || steps.sli.outcome != 'success' || (github.event_name == 'schedule' && (steps.heartbeat_start.outcome != 'success' || steps.heartbeat_complete.outcome != 'success')) || (github.event_name == 'push' && steps.heartbeat_bootstrap.outcome != 'success'))
        shell: bash
        run: exit 1
