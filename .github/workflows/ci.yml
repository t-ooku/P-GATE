name: Project GATE CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker
      - name: Run all regression tests
        run: npm test
      - name: Verify Worker package can be built
        working-directory: tools/line-worker
        run: npx wrangler deploy --dry-run
      - name: Block deterministic search-quality regressions
        working-directory: tools/line-worker
        run: npm run check:search-quality
      - name: Build single-file GAS bundle
        run: npm run build
      - name: Verify generated bundle is reproducible
        run: git diff --exit-code -- dist/Project_GATE_Complete.gs

  # feature/ui-search-v2 is the branch that tracks what's actually live on
  # hoshilu.app (confirmed 2026-08-06 - main has drifted 51 commits behind
  # with no merge path from this branch). Deploys the Worker only, and only
  # after the test job above is green.
  #
  # Deliberately narrow scope: D1 migrations and Secret rotation stay manual
  # per docs/HOSHILU_WORKER_RELEASE_RUNBOOK_2026-07-26.md (requires a D1
  # backup/verification step first) and
  # docs/HOSHILU_COMMAND_GOVERNANCE_2026-08-02.md (requires explicit
  # approval for production sync) - this job must not perform either
  # automatically.
  migrate-seller-console-d1:
    needs: test
    if: >-
      github.ref == 'refs/heads/feature/ui-search-v2' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[apply-0048]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-d1-seller-console
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker
      - name: Verify Cloudflare credentials are configured
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify only migration 0048 is pending
        working-directory: tools/line-worker
        run: |
          output="$(npx wrangler d1 migrations list hoshilu-products --remote 2>&1)"
          echo "$output"
          pending=()
          while IFS= read -r migration; do
            name="$(basename "$migration")"
            if grep -Fq "$name" <<<"$output"; then
              pending+=("$name")
            fi
          done < <(find migrations -maxdepth 1 -type f -name '*.sql' -print | sort)
          if [ "${pending[*]}" != "0048_seller_priority_console.sql" ]; then
            echo "::error::Expected only 0048_seller_priority_console.sql to be pending; found: ${pending[*]:-none}"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record D1 Time Travel restore point
        working-directory: tools/line-worker
        run: npx wrangler d1 time-travel info hoshilu-products --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply seller console migration
        working-directory: tools/line-worker
        run: npx wrangler d1 migrations apply hoshilu-products --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify seller console schema
        working-directory: tools/line-worker
        run: |
          output="$(npx wrangler d1 execute hoshilu-products --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('seller_priority_rules','seller_priority_memberships','seller_billing_wallets','seller_qualified_click_charges','seller_console_audit') ORDER BY name;")"
          echo "$output"
          for table in seller_priority_rules seller_priority_memberships seller_billing_wallets seller_qualified_click_charges seller_console_audit; do
            grep -Fq "\"$table\"" <<<"$output" || { echo "::error::Missing table $table"; exit 1; }
          done
          pending="$(npx wrangler d1 migrations list hoshilu-products --remote 2>&1)"
          if grep -Fq '0048_seller_priority_console.sql' <<<"$pending"; then
            echo "::error::Migration 0048 is still pending"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: [test, migrate-seller-console-d1]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.migrate-seller-console-d1.result == 'success' &&
      github.ref == 'refs/heads/feature/ui-search-v2' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker
      - name: Check Cloudflare credentials are configured
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID repository secrets are not set - skipping deploy. See docs/HOSHILU_WORKER_RELEASE_RUNBOOK_2026-07-26.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Worker
        if: steps.creds.outputs.configured == 'true'
        working-directory: tools/line-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
