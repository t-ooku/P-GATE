          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT COUNT(*) AS table_count FROM sqlite_master WHERE type='table' AND name='member_buzz_preferences';" > buzz-notification-table.json
          node -e "const d=JSON.parse(require('fs').readFileSync('buzz-notification-table.json','utf8'));const row=d.flatMap(x=>x.results||[])[0];if(Number(row?.table_count)!==1)throw new Error(JSON.stringify(row));"
      - name: Move only the two approved X reposts to the front of the due queue
        working-directory: tools/line-worker
