name: Project GATE CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker
      - name: Run all regression tests
        run: npm test
      - name: Block deterministic search-quality regressions
        working-directory: tools/line-worker
        run: npm run check:search-quality
      - name: Build single-file GAS bundle
        run: npm run build
      - name: Verify generated bundle is reproducible
        run: git diff --exit-code -- dist/Project_GATE_Complete.gs

  # feature/ui-search-v2 is the branch that tracks what's actually live on
  # hoshilu.app (confirmed 2026-08-06 - main has drifted 51 commits behind
  # with no merge path from this branch). Deploys the Worker only, and only
  # after the test job above is green.
  #
  # Deliberately narrow scope: D1 migrations and Secret rotation stay manual
  # per docs/HOSHILU_WORKER_RELEASE_RUNBOOK_2026-07-26.md (requires a D1
  # backup/verification step first) and
  # docs/HOSHILU_COMMAND_GOVERNANCE_2026-08-02.md (requires explicit
  # approval for production sync) - this job must not perform either
  # automatically.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/feature/ui-search-v2' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker
      - name: Check Cloudflare credentials are configured
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID repository secrets are not set - skipping deploy. See docs/HOSHILU_WORKER_RELEASE_RUNBOOK_2026-07-26.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Worker
        if: steps.creds.outputs.configured == 'true'
        working-directory: tools/line-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


  # One-time read-only verification for the explicitly approved 2026-08-12
  # Instagram reel. Remove after the terminal D1 result is confirmed.
  instagram-approved-reel-monitor:
    if: github.ref == 'refs/heads/feature/ui-search-v2' && github.event_name == 'push' && contains(github.event.head_commit.message, '[instagram-approved-reel-monitor]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker
      - name: Wait for Cron and verify the approved reel result
        working-directory: tools/line-worker
        run: |
          for attempt in $(seq 1 30); do
            output="$(npx wrangler d1 execute hoshilu-products --remote --command "SELECT status,external_post_id,last_error,published_at,updated_at FROM social_post_queue WHERE post_id='hoshilu-approved-model-reel-20260812'")"
            echo "$output"
            if echo "$output" | grep -q '"status": "PUBLISHED"'; then
              exit 0
            fi
            if echo "$output" | grep -q '"status": "FAILED"'; then
              exit 1
            fi
            sleep 30
          done
          echo "::error::Approved Instagram reel did not reach a terminal state."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
