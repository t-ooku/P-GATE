          node ops/runway/verify_initial_reel_publish.mjs published initial-reel-published-queue.json initial-reel-published-performance.json initial-reel-public-result.json

      - name: Reconcile the Runway job after verified publication
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --file ops/runway/reconcile_initial_reel_20260813_v4.sql --yes > initial-reel-reconcile-mutation.json
          expected_rows=6
          if [ '${{ steps.preflight.outputs.mode }}' = published ]; then expected_rows=0; fi
          node ops/runway/verify_initial_reel_publish.mjs import-mutation initial-reel-reconcile-mutation.json 3 "$expected_rows"
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT job_id,post_id,provider_task_id,status,expected_credits,rights_confirmed,ai_disclosure_confirmed,attempt_count,max_attempts,storage_key,storage_etag,storage_size_bytes,storage_content_type,qa_status,caption,updated_at FROM runway_generation_jobs WHERE job_id='runway-hoshilu-model-ugc-test-20260813-v1';" > initial-reel-job-reconciled.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT initial_cap_credits,monthly_cap_credits,enabled,kill_switch,initial_test_completed FROM runway_budget_policy WHERE policy_id=1;" > initial-reel-policy-reconciled.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT audit_id,event,detail,created_at FROM runway_audit_log WHERE audit_id='runway-initial-reel-v4-published-20260813';" > initial-reel-published-audit.json
          node ops/runway/verify_initial_reel_publish.mjs reconciled initial-reel-job-reconciled.json initial-reel-policy-reconciled.json initial-reel-published-audit.json
          echo '::notice::INITIAL_REEL_PUBLISHED verified=true duplicate=false kpi_attribution=started'

      - name: Preserve non-secret publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runway-initial-reel-publish-${{ github.run_id }}
