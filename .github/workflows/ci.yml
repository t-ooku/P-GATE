name: Project GATE CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker
      - name: Run all regression tests
        run: npm test
      - name: Block deterministic search-quality regressions
        working-directory: tools/line-worker
        run: npm run check:search-quality
      - name: Build single-file GAS bundle
        run: npm run build
      - name: Verify generated bundle is reproducible
        run: git diff --exit-code -- dist/Project_GATE_Complete.gs

  # feature/ui-search-v2 is the branch that tracks what's actually live on
  # hoshilu.app (confirmed 2026-08-06 - main has drifted 51 commits behind
  # with no merge path from this branch). Deploys the Worker only, and only
  # after the test job above is green.
  #
  # Deliberately narrow scope: D1 migrations and Secret rotation stay manual
  # per docs/HOSHILU_WORKER_RELEASE_RUNBOOK_2026-07-26.md (requires a D1
  # backup/verification step first) and
  # docs/HOSHILU_COMMAND_GOVERNANCE_2026-08-02.md (requires explicit
  # approval for production sync). The isolated Runway setup below runs only
  # with its explicit, user-approved commit marker and captures a restore point.
  runway-infra-setup:
    needs: test
    if: >-
      github.ref == 'refs/heads/feature/ui-search-v2' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[setup-runway-infra-approved]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-runway-infra
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify approved migration and credentials
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          actual="$(sha256sum migrations/0050_runway_video_generation.sql | cut -d' ' -f1)"
          test "$actual" = "4cbd032c9f6cf59075c04dd1f09d5259025f6fd18cf336aac79ca9be7fc694b8"
          if grep -iqE '(^|[[:space:]])(delete|drop|truncate|alter)[[:space:]]' migrations/0050_runway_video_generation.sql; then
            echo "::error::Destructive statement found in 0050"
            exit 1
          fi
          node --test test/runway-video-generation-migration.test.mjs test/runway-generation.test.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Capture D1 restore point and prepare isolated migration
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 time-travel info PRODUCT_DB --json > runway-recovery-bookmark-before.json
          mkdir -p .migration-runway-0050
          cp migrations/0050_runway_video_generation.sql .migration-runway-0050/0050_runway_video_generation.sql
          cat > wrangler-runway-0050.jsonc <<'JSON'
          {
            "name": "project-gate-line-bridge",
            "main": "src/index.mjs",
            "compatibility_date": "2026-07-14",
            "d1_databases": [{
              "binding": "PRODUCT_DB",
              "database_name": "hoshilu-products",
              "database_id": "17629324-b771-4348-982c-c25da48c29b2",
              "migrations_dir": ".migration-runway-0050"
            }]
          }
          JSON
          npx --yes wrangler@4.121.0 d1 migrations list PRODUCT_DB --remote --config wrangler-runway-0050.jsonc > runway-pending-before.txt
          pending_count="$(grep -c '0050_runway_video_generation.sql' runway-pending-before.txt || true)"
          test "$pending_count" -le 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Create bounded R2 media storage and 90-day lifecycle
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          if npx --yes wrangler@4.121.0 r2 bucket info hoshilu-social-media > runway-r2-info-before.txt 2>&1; then
            echo "R2 bucket already exists"
          else
            npx --yes wrangler@4.121.0 r2 bucket create hoshilu-social-media
          fi
          npx --yes wrangler@4.121.0 r2 bucket lifecycle list hoshilu-social-media > runway-r2-lifecycle-before.txt
          if grep -Fq 'expire-runway-media-90d' runway-r2-lifecycle-before.txt; then
            npx --yes wrangler@4.121.0 r2 bucket lifecycle remove hoshilu-social-media --name expire-runway-media-90d
          fi
          npx --yes wrangler@4.121.0 r2 bucket lifecycle add hoshilu-social-media expire-runway-media-90d runway/ --expire-days 90 --force
          npx --yes wrangler@4.121.0 r2 bucket info hoshilu-social-media > runway-r2-info-after.txt
          npx --yes wrangler@4.121.0 r2 bucket lifecycle list hoshilu-social-media > runway-r2-lifecycle-after.txt
          grep -Fq 'expire-runway-media-90d' runway-r2-lifecycle-after.txt
          grep -Fq 'runway/' runway-r2-lifecycle-after.txt
          grep -Eq '90([^0-9]|$)' runway-r2-lifecycle-after.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply only Runway migration 0050 and verify policy
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 migrations apply PRODUCT_DB --remote --config wrangler-runway-0050.jsonc
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT initial_cap_credits,monthly_cap_credits,enabled,kill_switch,initial_test_completed FROM runway_budget_policy WHERE policy_id=1;" > runway-policy-after.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT COUNT(*) AS table_count FROM sqlite_master WHERE type='table' AND name IN ('runway_budget_policy','runway_budget_periods','runway_generation_jobs','runway_generation_attempts','runway_cost_reservations','runway_provider_usage_daily','runway_approval_grants','runway_audit_log');" > runway-tables-after.json
          node <<'NODE'
          const fs=require('node:fs');
          const rows=(name)=>{const d=JSON.parse(fs.readFileSync(name));return (Array.isArray(d)?d:[d]).flatMap(x=>x.results||x.result?.results||[]);};
          const policy=rows('runway-policy-after.json')[0], tables=rows('runway-tables-after.json')[0];
          if(Number(policy?.initial_cap_credits)!==1000||Number(policy?.monthly_cap_credits)!==3000||Number(policy?.enabled)!==1||Number(policy?.kill_switch)!==0||Number(policy?.initial_test_completed)!==0||Number(tables?.table_count)!==8) throw new Error(JSON.stringify({policy,tables}));
          console.log('::notice::RUNWAY_INFRA_READY initial=1000 monthly=3000 autobilling=unchanged tables=8');
          NODE
          npx --yes wrangler@4.121.0 d1 migrations list PRODUCT_DB --remote --config wrangler-runway-0050.jsonc > runway-pending-after.txt
          if grep -Fq '0050_runway_video_generation.sql' runway-pending-after.txt; then exit 1; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Preserve Runway infrastructure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runway-infra-setup-${{ github.run_id }}
          path: |
            tools/line-worker/runway-recovery-bookmark-before.json
            tools/line-worker/runway-pending-before.txt
            tools/line-worker/runway-pending-after.txt
            tools/line-worker/runway-policy-after.json
            tools/line-worker/runway-tables-after.json
            tools/line-worker/runway-r2-info-before.txt
            tools/line-worker/runway-r2-info-after.txt
            tools/line-worker/runway-r2-lifecycle-before.txt
            tools/line-worker/runway-r2-lifecycle-after.txt
          retention-days: 30

  deploy:
    needs: [test, runway-infra-setup]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (needs.runway-infra-setup.result == 'success' || needs.runway-infra-setup.result == 'skipped') &&
      github.ref == 'refs/heads/feature/ui-search-v2' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker
      - name: Require Cloudflare credentials for production deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID are required for the production deploy. See docs/HOSHILU_WORKER_RELEASE_RUNBOOK_2026-07-26.md."
            exit 1
          fi
      - name: Deploy Worker
        working-directory: tools/line-worker
        run: npx --yes wrangler@4.121.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health, assets and critical API contracts
        working-directory: tools/line-worker
        run: node scripts/check-production-health.mjs --attempts 6 --retry-ms 10000

  runway-initial-test-start:
    needs: [test, deploy]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.deploy.result == 'success' &&
      github.ref == 'refs/heads/feature/ui-search-v2' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[start-runway-initial-test-approved]')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: runway-initial-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify approved job definition and production readiness
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          actual="$(sha256sum ops/runway/initial_test_job_20260813.sql | cut -d' ' -f1)"
          test "$actual" = "bc56ba97729aebf4c0d5f3493db9b3c4072b7b818fa31858afdc492365e38691"
          health="$(curl --fail-with-body --silent --show-error 'https://hoshilu.app/health?runway-initial-test=1')"
          HEALTH="$health" node <<'NODE'
          const health=JSON.parse(process.env.HEALTH);
          const runway=health?.checks?.runway_video_generation;
          const db=health?.checks?.database_features||{};
          const tables=['runway_budget_policy','runway_budget_periods','runway_generation_jobs','runway_generation_attempts','runway_cost_reservations','runway_provider_usage_daily','runway_approval_grants','runway_audit_log'];
          if(health.ok!==true||health.release!=='1.19.0'||runway?.api_configured!==true||runway?.database_configured!==true||runway?.media_storage_configured!==true||runway?.enabled!==true||runway?.ready!==true||tables.some(name=>db[name]!==true)) throw new Error(JSON.stringify({ok:health.ok,release:health.release,runway,runway_tables:Object.fromEntries(tables.map(name=>[name,db[name]]))}));
          console.log('::notice::RUNWAY_PRODUCTION_READY secret=present database=ready storage=ready generation=enabled');
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Insert exactly one approved initial test job
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --file ops/runway/initial_test_job_20260813.sql --yes
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT job_id,post_id,request_fingerprint,status,recipe,recipe_version,character_image_url,product_image_url,duration_seconds,ratio,audio,product_info,user_concept,caption,link,expected_credits,rights_confirmed,ai_disclosure_confirmed,max_attempts,provider_task_id,storage_key,last_error_code,last_error_stage,updated_at FROM runway_generation_jobs WHERE job_id='runway-hoshilu-model-ugc-test-20260813-v1';" > runway-initial-job.json
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');const d=require('./runway-initial-job.json'); const row=(Array.isArray(d)?d:[d]).flatMap(x=>x.results||x.result?.results||[])[0];
          const fingerprintPayload={recipe:row?.recipe,recipe_version:row?.recipe_version,character_image_url:row?.character_image_url,product_image_url:row?.product_image_url,duration_seconds:Number(row?.duration_seconds),ratio:row?.ratio,audio:Number(row?.audio),expected_credits:Number(row?.expected_credits),product_info:row?.product_info,user_concept:row?.user_concept};
          const fingerprint=crypto.createHash('sha256').update(JSON.stringify(fingerprintPayload)).digest('hex');
          const expected={job_id:'runway-hoshilu-model-ugc-test-20260813-v1',post_id:'hoshilu-runway-model-ugc-20260813-v1',request_fingerprint:'c93f00332ed1dce7631663a67be340eb484de1c2c374deacceedbd783c34a3e1',recipe:'product_ugc',recipe_version:'2026-06',character_image_url:'https://hoshilu.app/social/runway/hoshilu-approved-model-reference-v1.jpg',product_image_url:'https://hoshilu.app/social/runway/hoshilu-product-screen-v1.jpg',ratio:'720:1280'};
          if(!row||Object.entries(expected).some(([k,v])=>row[k]!==v)||fingerprint!==expected.request_fingerprint||!['APPROVED','BUDGET_RESERVED','SUBMITTING','PROCESSING','GENERATED_REVIEW_REQUIRED'].includes(row.status)||Number(row.duration_seconds)!==8||Number(row.audio)!==1||Number(row.expected_credits)!==336||Number(row.rights_confirmed)!==1||Number(row.ai_disclosure_confirmed)!==1||Number(row.max_attempts)!==1||!String(row.caption||'').includes('AI生成・AI加工映像')||new URL(row.link).searchParams.get('utm_content')!=='runway_product_ugc_test_20260813_v1') throw new Error(JSON.stringify({row,fingerprint}));
          console.log(`::notice::RUNWAY_INITIAL_JOB status=${row.status} expected_credits=336 max_attempts=1 external_publish=false`);
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Monitor generation through R2 persistence without publishing
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT job_id,status,expected_credits,provider_task_id,storage_key,storage_size_bytes,qa_status,last_error_code,last_error_stage,submitted_at,generated_at,updated_at FROM runway_generation_jobs WHERE job_id='runway-hoshilu-model-ugc-test-20260813-v1';" > runway-initial-job.json
            status="$(node -e "const d=require('./runway-initial-job.json');const r=(Array.isArray(d)?d:[d]).flatMap(x=>x.results||x.result?.results||[])[0];process.stdout.write(String(r?.status||''))")"
            echo "Runway initial test status: ${status:-MISSING} (check $attempt/120)"
            case "$status" in
              GENERATED_REVIEW_REQUIRED)
                npx --yes wrangler@4.121.0 r2 object get 'hoshilu-social-media/runway/runway-hoshilu-model-ugc-test-20260813-v1/output.mp4' --remote --file runway-initial-output.mp4
                test -s runway-initial-output.mp4
                node -e "const fs=require('node:fs');const n=fs.statSync('runway-initial-output.mp4').size;if(n<=0||n>104857600)process.exit(1);console.log('Runway output bytes:',n)"
                echo "::notice::RUNWAY_INITIAL_TEST_GENERATED review_required=true external_publish=false"
                exit 0
                ;;
              FAILED_FINAL|BUDGET_BLOCKED|AMBIGUOUS_SUBMISSION|CANCELLED)
                echo "::error::Runway initial test stopped with status $status"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::Runway initial test monitor timed out without claiming success"
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Preserve initial test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runway-initial-test-${{ github.run_id }}
          path: |
            tools/line-worker/runway-initial-job.json
            tools/line-worker/runway-initial-output.mp4
          retention-days: 1

  # One-shot publication of the exact post-processed candidate explicitly
  # approved on 2026-08-13. The public repository never receives the model
  # video or font binaries: the runner pulls raw media from private R2 and the
  # pinned fonts from their official upstream, then fails unless the rendered
  # bytes exactly match the approved SHA-256.
  runway-initial-reel-publish:
    needs: [test, deploy]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.deploy.result == 'success' &&
      github.ref == 'refs/heads/feature/ui-search-v2' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[publish-runway-initial-reel-approved]')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    concurrency:
      group: runway-initial-reel-publish
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify controlled publication source and disabled replay flags
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          grep -Fq "is_ai_generated: true" src/social-publisher.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          for (const name of ['APPROVED_MODEL_REEL_REPLAY_ENABLED', 'INSTAGRAM_EVERGREEN_AUTOPILOT_ENABLED']) {
            if (config.vars?.[name] === 'true') throw new Error(`${name} must remain disabled for the one-shot publication`);
          }
          const source = fs.readFileSync('src/social-autopilot.mjs', 'utf8');
          for (const guard of [
            "env.APPROVED_MODEL_REEL_REPLAY_ENABLED === 'true'",
            "env.INSTAGRAM_EVERGREEN_AUTOPILOT_ENABLED === 'true'"
          ]) if (!source.includes(guard)) throw new Error(`Missing opt-in guard: ${guard}`);
          NODE
          sha256sum -c <<'HASHES'
          d714f1254f81c3ca02753ec4872e85932f4c5d09d9200fa588e74e33172eb89f  ops/runway/render_initial_reel_20260813.sh
          51f80759a3f3bf1cf4ae46513ba5e885ea718e90f8183ad00f01eeaafd93c3eb  ops/runway/initial_reel_overlay_20260813.ass
          HASHES
          node --test test/social-publisher.test.mjs test/runway-initial-reel-publish.test.mjs

      - name: Read production state and block duplicates or competing Instagram posts
        id: preflight
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error 'https://hoshilu.app/health?runway-initial-reel-publish=1' > initial-reel-health.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT job_id,post_id,provider_task_id,status,expected_credits,rights_confirmed,ai_disclosure_confirmed,attempt_count,max_attempts,storage_key,storage_etag,storage_size_bytes,storage_content_type,qa_status,caption,updated_at FROM runway_generation_jobs WHERE job_id='runway-hoshilu-model-ugc-test-20260813-v1';" > initial-reel-job-preflight.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id,platform,campaign_id,content_id,caption,link,media_url,scheduled_at,status,affiliate,platform_job_id,external_post_id,last_error,approved_at,published_at,updated_at FROM social_post_queue WHERE post_id='hoshilu-runway-model-ugc-20260813-v1';" > initial-reel-queue-preflight.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT (SELECT COUNT(*) FROM social_post_queue WHERE post_id<>'hoshilu-runway-model-ugc-20260813-v1' AND platform='INSTAGRAM' AND (content_id='runway-hoshilu-model-ugc-test-20260813-v1' OR media_url='https://hoshilu.app/api/social/media/runway/runway-hoshilu-model-ugc-test-20260813-v1.mp4' OR link='https://hoshilu.app/?utm_source=instagram&utm_medium=organic_social&utm_campaign=hoshilu_runway_test&utm_content=runway_product_ugc_test_20260813_v1') AND (status IN ('APPROVED','PUBLISHING','PUBLISHED') OR external_post_id<>'' OR platform_job_id<>'')) AS duplicate_count,(SELECT COUNT(*) FROM social_post_queue WHERE post_id<>'hoshilu-runway-model-ugc-20260813-v1' AND platform='INSTAGRAM' AND status IN ('APPROVED','PUBLISHING') AND scheduled_at<=strftime('%Y-%m-%dT%H:%M:%fZ','now')) AS competing_due_count;" > initial-reel-collision-preflight.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT account_id,scopes,expires_at,status,last_refreshed_at FROM instagram_oauth_credentials WHERE platform='INSTAGRAM';" > initial-reel-instagram-credential.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT initial_cap_credits,monthly_cap_credits,enabled,kill_switch,initial_test_completed FROM runway_budget_policy WHERE policy_id=1;" > initial-reel-policy.json
          mode="$(node ops/runway/verify_initial_reel_publish.mjs preflight initial-reel-health.json initial-reel-job-preflight.json initial-reel-queue-preflight.json initial-reel-collision-preflight.json initial-reel-instagram-credential.json initial-reel-policy.json)"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "::notice::INITIAL_REEL_PREFLIGHT mode=${mode} duplicate=0 competing_due=0"

      - name: Capture D1 restore point before approved mutations
        if: steps.preflight.outputs.mode == 'review'
        working-directory: tools/line-worker
        run: npx --yes wrangler@4.121.0 d1 time-travel info PRODUCT_DB --json > initial-reel-recovery-bookmark-before.json

      - name: Install the pinned media toolchain
        if: steps.preflight.outputs.mode == 'review'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg=7:6.1.1-3ubuntu5
          cat > "${RUNNER_TEMP}/expected-media-packages.txt" <<'PACKAGES'
          ffmpeg=7:6.1.1-3ubuntu5
          libass9=1:0.17.1-2build1
          libfontconfig1=2.15.0-1.1ubuntu2
          libfreetype6=2.13.2+dfsg-1ubuntu0.1
          libfribidi0=1.0.13-3build1
          libharfbuzz0b=8.3.0-2build2
          libx264-164=2:0.164.3108+git31e19f9-1
          PACKAGES
          dpkg-query -W -f='${Package}=${Version}\n' \
            ffmpeg libass9 libfontconfig1 libfreetype6 libfribidi0 libharfbuzz0b libx264-164 \
            > "${RUNNER_TEMP}/actual-media-packages.txt"
          diff -u "${RUNNER_TEMP}/expected-media-packages.txt" "${RUNNER_TEMP}/actual-media-packages.txt"

      - name: Reproduce and byte-verify the approved candidate
        if: steps.preflight.outputs.mode == 'review'
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          first_line="$(ffmpeg -version | sed -n '1p')"
          case "$first_line" in
            'ffmpeg version 6.1.1-3ubuntu5 '*) ;;
            *) echo "::error::Unexpected ffmpeg build: $first_line"; exit 1 ;;
          esac
          work_dir="${RUNNER_TEMP}/hoshilu-initial-reel"
          font_dir="${work_dir}/fonts"
          mkdir -p "$font_dir"
          raw_video="${work_dir}/raw.mp4"
          candidate="${work_dir}/candidate.mp4"
          candidate_repeat="${work_dir}/candidate-repeat.mp4"

          npx --yes wrangler@4.121.0 r2 object get 'hoshilu-social-media/runway/runway-hoshilu-model-ugc-test-20260813-v1/output.mp4' --remote --file "$raw_video"
          echo '6caeb845203e7d1d6453c31fd7c44e6157befffd8e5699fb749f42c4e1d31ef7  '"$raw_video" | sha256sum -c -

          curl --fail-with-body --location --silent --show-error \
            'https://raw.githubusercontent.com/notofonts/noto-cjk/v1.004/NotoSansCJKjp-Bold.otf' \
            --output "${font_dir}/NotoSansCJKjp-Bold.otf"
          curl --fail-with-body --location --silent --show-error \
            'https://raw.githubusercontent.com/notofonts/noto-cjk/v1.004/NotoSansCJKjp-Regular.otf' \
            --output "${font_dir}/NotoSansCJKjp-Regular.otf"
          echo '9ca911f033c616162bc2d2f1d61c6739df8bc7a9bd027df0ed57c96029b33a7a  '"${font_dir}/NotoSansCJKjp-Bold.otf" | sha256sum -c -
          echo 'f18253affd968c8ea592d8df6d84b1d4c5d3a46d267e53a1f6749e6c4f76a23d  '"${font_dir}/NotoSansCJKjp-Regular.otf" | sha256sum -c -
          echo '0808fd0e65b9dd4fa832b6403842ba451bd0a722f27c58c396db7d85bbbf0bdb  public/social/runway/hoshilu-product-screen-v1.jpg' | sha256sum -c -

          HOSHILU_FONT_DIR="$font_dir" bash ops/runway/render_initial_reel_20260813.sh "$raw_video" "$candidate" 2>&1 | tee initial-reel-render-first.log
          HOSHILU_FONT_DIR="$font_dir" bash ops/runway/render_initial_reel_20260813.sh "$raw_video" "$candidate_repeat" 2>&1 | tee initial-reel-render-repeat.log
          cmp --silent "$candidate" "$candidate_repeat"
          grep -Fq 'using cpu capabilities: none!' initial-reel-render-first.log
          grep -Eq 'threads=1 .*lookahead_threads=1 .*sliced_threads=0' initial-reel-render-first.log
          grep -Fq 'using cpu capabilities: none!' initial-reel-render-repeat.log
          grep -Eq 'threads=1 .*lookahead_threads=1 .*sliced_threads=0' initial-reel-render-repeat.log
          ffmpeg -v error -i "$candidate" -f null -
          ffprobe -v error -show_streams -show_format -of json "$candidate" > initial-reel-candidate-ffprobe.json
          audio_sha="$(ffmpeg -v error -i "$candidate" -map 0:a:0 -c copy -f hash -hash sha256 - | sed -n 's/^SHA256=//p')"
          node ops/runway/verify_initial_reel_publish.mjs candidate "$candidate" initial-reel-candidate-ffprobe.json "$audio_sha" > initial-reel-candidate-evidence.json
          echo "candidate=${candidate}" >> "$GITHUB_ENV"
          echo "::notice::INITIAL_REEL_CANDIDATE sha256=88e65826b923bbf11cfcf99228367a629c76a2eddc51ab661a58be36395b71b9 bytes=1565856"

      - name: Put immutable candidate in private R2 and verify round-trip bytes
        if: steps.preflight.outputs.mode == 'review'
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          object='hoshilu-social-media/runway/runway-hoshilu-model-ugc-test-20260813-v1/postprocessed-88e65826b923bbf11cfcf99228367a629c76a2eddc51ab661a58be36395b71b9.mp4'
          existing="${RUNNER_TEMP}/hoshilu-initial-reel/existing.mp4"
          get_log="${RUNNER_TEMP}/hoshilu-initial-reel/r2-get-existing.log"
          get_r2_object_with_missing_retry() {
            local output_file="$1"
            local log_file="$2"
            local status=1
            for attempt in $(seq 1 6); do
              if npx --yes wrangler@4.121.0 r2 object get "$object" --remote --file "$output_file" > "$log_file" 2>&1; then
                return 0
              else
                status=$?
              fi
              if ! grep -Eiq 'not found|does not exist|specified key does not exist|404' "$log_file"; then
                sed -n '1,80p' "$log_file" >&2
                return "$status"
              fi
              [ "$attempt" -lt 6 ] && sleep 2
            done
            return 44
          }
          if get_r2_object_with_missing_retry "$existing" "$get_log"; then
            get_status=0
          else
            get_status=$?
          fi
          if [ "$get_status" -eq 0 ]; then
            echo '88e65826b923bbf11cfcf99228367a629c76a2eddc51ab661a58be36395b71b9  '"$existing" | sha256sum -c -
          elif grep -Eiq 'not found|does not exist|404' "$get_log"; then
            npx --yes wrangler@4.121.0 r2 object put "$object" --remote --file "$candidate" \
              --content-type 'video/mp4' \
              --cache-control 'public, max-age=3600, stale-while-revalidate=86400' \
              --force
          else
            sed -n '1,80p' "$get_log" >&2
            echo '::error::R2 existence check failed for a reason other than object absence'
            exit 1
          fi
          roundtrip="${RUNNER_TEMP}/hoshilu-initial-reel/roundtrip.mp4"
          roundtrip_log="${RUNNER_TEMP}/hoshilu-initial-reel/r2-get-roundtrip.log"
          if get_r2_object_with_missing_retry "$roundtrip" "$roundtrip_log"; then
            roundtrip_status=0
          else
            roundtrip_status=$?
            sed -n '1,80p' "$roundtrip_log" >&2
            echo '::error::R2 round-trip verification failed after bounded retries'
            exit 1
          fi
          cmp --silent "$candidate" "$roundtrip"
          echo '88e65826b923bbf11cfcf99228367a629c76a2eddc51ab661a58be36395b71b9  '"$roundtrip" | sha256sum -c -

      - name: Stage candidate identity and approved caption while gates remain closed
        if: steps.preflight.outputs.mode == 'review'
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --file ops/runway/stage_initial_reel_20260813_v4.sql --yes > initial-reel-stage-mutation.json
          node ops/runway/verify_initial_reel_publish.mjs import-mutation initial-reel-stage-mutation.json 2 2
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT job_id,post_id,provider_task_id,status,expected_credits,rights_confirmed,ai_disclosure_confirmed,attempt_count,max_attempts,storage_key,storage_etag,storage_size_bytes,storage_content_type,qa_status,caption,updated_at FROM runway_generation_jobs WHERE job_id='runway-hoshilu-model-ugc-test-20260813-v1';" > initial-reel-job-staged.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id,platform,campaign_id,content_id,caption,link,media_url,scheduled_at,status,affiliate,platform_job_id,external_post_id,last_error,approved_at,published_at,updated_at FROM social_post_queue WHERE post_id='hoshilu-runway-model-ugc-20260813-v1';" > initial-reel-queue-staged.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT (SELECT COUNT(*) FROM social_post_queue WHERE post_id<>'hoshilu-runway-model-ugc-20260813-v1' AND platform='INSTAGRAM' AND (content_id='runway-hoshilu-model-ugc-test-20260813-v1' OR media_url='https://hoshilu.app/api/social/media/runway/runway-hoshilu-model-ugc-test-20260813-v1.mp4' OR link='https://hoshilu.app/?utm_source=instagram&utm_medium=organic_social&utm_campaign=hoshilu_runway_test&utm_content=runway_product_ugc_test_20260813_v1') AND (status IN ('APPROVED','PUBLISHING','PUBLISHED') OR external_post_id<>'' OR platform_job_id<>'')) AS duplicate_count,(SELECT COUNT(*) FROM social_post_queue WHERE post_id<>'hoshilu-runway-model-ugc-20260813-v1' AND platform='INSTAGRAM' AND status IN ('APPROVED','PUBLISHING') AND scheduled_at<=strftime('%Y-%m-%dT%H:%M:%fZ','now')) AS competing_due_count;" > initial-reel-collision-staged.json
          node ops/runway/verify_initial_reel_publish.mjs staged initial-reel-job-staged.json initial-reel-queue-staged.json initial-reel-collision-staged.json
          echo '::notice::INITIAL_REEL_STAGED external_publish=false queue=REVIEW_REQUIRED qa=PENDING'

      - name: Apply explicit QA approval while publication remains closed
        if: steps.preflight.outputs.mode == 'review'
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --file ops/runway/approve_initial_reel_20260813_v4.sql --yes > initial-reel-approve-mutation.json
          node ops/runway/verify_initial_reel_publish.mjs import-mutation initial-reel-approve-mutation.json 2 5
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT job_id,post_id,provider_task_id,status,expected_credits,rights_confirmed,ai_disclosure_confirmed,attempt_count,max_attempts,storage_key,storage_etag,storage_size_bytes,storage_content_type,qa_status,caption,updated_at FROM runway_generation_jobs WHERE job_id='runway-hoshilu-model-ugc-test-20260813-v1';" > initial-reel-job-qa-approved.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id,platform,campaign_id,content_id,caption,link,media_url,scheduled_at,status,affiliate,platform_job_id,external_post_id,last_error,approved_at,published_at,updated_at FROM social_post_queue WHERE post_id='hoshilu-runway-model-ugc-20260813-v1';" > initial-reel-queue-qa-approved.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT audit_id,event,detail,created_at FROM runway_audit_log WHERE audit_id='runway-initial-reel-v4-qa-approved-20260813';" > initial-reel-approval-audit.json
          node ops/runway/verify_initial_reel_publish.mjs qa-approved initial-reel-job-qa-approved.json initial-reel-queue-qa-approved.json initial-reel-approval-audit.json
          echo '::notice::INITIAL_REEL_QA_APPROVED external_publish=false queue=REVIEW_REQUIRED'

      - name: Verify the approved public media route before releasing the queue
        if: steps.preflight.outputs.mode == 'review' || steps.preflight.outputs.mode == 'qa_approved'
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          media_url='https://hoshilu.app/api/social/media/runway/runway-hoshilu-model-ugc-test-20260813-v1.mp4'
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --head --output initial-reel-media-head.txt --write-out '%{http_code}' "$media_url")"
            [ "$status" = 200 ] && break
            sleep 5
          done
          test "$status" = 200
          grep -Eiq '^content-type:[[:space:]]*video/mp4([[:space:]]|$)' initial-reel-media-head.txt
          grep -Eiq '^content-length:[[:space:]]*1565856([[:space:]]|$)' initial-reel-media-head.txt
          range_status="$(curl --silent --show-error --fail-with-body --header 'Range: bytes=0-1023' --output initial-reel-media-range.bin --dump-header initial-reel-media-range-headers.txt --write-out '%{http_code}' "$media_url")"
          test "$range_status" = 206
          test "$(stat -c '%s' initial-reel-media-range.bin)" = 1024
          grep -Eiq '^content-type:[[:space:]]*video/mp4([[:space:]]|$)' initial-reel-media-range-headers.txt
          grep -Eiq '^content-range:[[:space:]]*bytes 0-1023/1565856([[:space:]]|$)' initial-reel-media-range-headers.txt
          curl --fail-with-body --silent --show-error "$media_url" --output initial-reel-media-full.mp4
          echo '88e65826b923bbf11cfcf99228367a629c76a2eddc51ab661a58be36395b71b9  initial-reel-media-full.mp4' | sha256sum -c -
          echo '::notice::INITIAL_REEL_MEDIA_ROUTE status=200 range=206 bytes=1565856 type=video/mp4'

      - name: Release the target queue as the final pre-publication mutation
        if: steps.preflight.outputs.mode == 'review' || steps.preflight.outputs.mode == 'qa_approved'
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --file ops/runway/release_initial_reel_20260813_v4.sql --yes > initial-reel-release-mutation.json
          node ops/runway/verify_initial_reel_publish.mjs import-mutation initial-reel-release-mutation.json 1 2
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT job_id,post_id,provider_task_id,status,expected_credits,rights_confirmed,ai_disclosure_confirmed,attempt_count,max_attempts,storage_key,storage_etag,storage_size_bytes,storage_content_type,qa_status,caption,updated_at FROM runway_generation_jobs WHERE job_id='runway-hoshilu-model-ugc-test-20260813-v1';" > initial-reel-job-approved.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id,platform,campaign_id,content_id,caption,link,media_url,scheduled_at,status,affiliate,platform_job_id,external_post_id,last_error,approved_at,published_at,updated_at FROM social_post_queue WHERE post_id='hoshilu-runway-model-ugc-20260813-v1';" > initial-reel-queue-approved.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT audit_id,event,detail,created_at FROM runway_audit_log WHERE audit_id='runway-initial-reel-v4-qa-approved-20260813';" > initial-reel-approval-audit.json
          node ops/runway/verify_initial_reel_publish.mjs approved initial-reel-job-approved.json initial-reel-queue-approved.json initial-reel-approval-audit.json
          echo '::notice::INITIAL_REEL_APPROVED cron_publish_pending=true'

      - name: Monitor the existing idempotent publisher through completion
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          published=false
          for attempt in $(seq 1 105); do
            npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id,platform,campaign_id,content_id,caption,link,media_url,scheduled_at,status,affiliate,platform_job_id,external_post_id,last_error,approved_at,published_at,updated_at FROM social_post_queue WHERE post_id='hoshilu-runway-model-ugc-20260813-v1';" > initial-reel-publish-queue.json
            status="$(node ops/runway/verify_initial_reel_publish.mjs status initial-reel-publish-queue.json)"
            echo "Initial reel publication status: ${status} (check ${attempt}/105)"
            case "$status" in
              PUBLISHED) published=true; break ;;
              APPROVED|PUBLISHING) sleep 20 ;;
              FAILED)
                node -e "const d=require('./initial-reel-publish-queue.json');const r=(Array.isArray(d)?d:[d]).flatMap(x=>x.results||x.result?.results||[])[0];console.error('::error::INITIAL_REEL_PUBLISH_FAILED '+String(r?.last_error||'UNKNOWN').slice(0,300));"
                exit 1
                ;;
              *) echo "::error::Unexpected publication status: ${status}"; exit 1 ;;
            esac
          done
          if [ "$published" != true ]; then
            echo '::error::Initial reel publication monitor timed out without claiming success'
            exit 1
          fi

      - name: Resolve and verify the public Instagram permalink
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          resolved=false
          for attempt in $(seq 1 30); do
            http_status="$(curl --silent --show-error --output initial-reel-public-result.json --write-out '%{http_code}' 'https://hoshilu.app/api/social/posts/hoshilu-runway-model-ugc-20260813-v1')"
            if [ "$http_status" = 200 ] && node -e "const p=require('./initial-reel-public-result.json');if(p.ok!==true||!p.public_url)process.exit(1)"; then
              resolved=true
              break
            fi
            if [ "$http_status" != 200 ] && [ "$http_status" != 202 ]; then
              echo "Instagram permalink response: HTTP ${http_status} (check ${attempt}/30)"
            fi
            sleep 10
          done
          if [ "$resolved" != true ]; then
            echo '::error::Instagram publication exists but its public permalink was not confirmed'
            exit 1
          fi
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id,platform,campaign_id,content_id,caption,link,media_url,scheduled_at,status,affiliate,platform_job_id,external_post_id,last_error,approved_at,published_at,updated_at FROM social_post_queue WHERE post_id='hoshilu-runway-model-ugc-20260813-v1';" > initial-reel-published-queue.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id,platform,snapshot_at,published_at,public_url,utm_source,utm_medium,utm_campaign,utm_content,traffic_class FROM social_post_performance WHERE post_id='hoshilu-runway-model-ugc-20260813-v1' AND public_url<>'' ORDER BY snapshot_at DESC LIMIT 1;" > initial-reel-published-performance.json
          node ops/runway/verify_initial_reel_publish.mjs published initial-reel-published-queue.json initial-reel-published-performance.json initial-reel-public-result.json

      - name: Reconcile the Runway job after verified publication
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --file ops/runway/reconcile_initial_reel_20260813_v4.sql --yes > initial-reel-reconcile-mutation.json
          expected_rows=6
          if [ '${{ steps.preflight.outputs.mode }}' = published ]; then expected_rows=0; fi
          node ops/runway/verify_initial_reel_publish.mjs import-mutation initial-reel-reconcile-mutation.json 3 "$expected_rows"
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT job_id,post_id,provider_task_id,status,expected_credits,rights_confirmed,ai_disclosure_confirmed,attempt_count,max_attempts,storage_key,storage_etag,storage_size_bytes,storage_content_type,qa_status,caption,updated_at FROM runway_generation_jobs WHERE job_id='runway-hoshilu-model-ugc-test-20260813-v1';" > initial-reel-job-reconciled.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT initial_cap_credits,monthly_cap_credits,enabled,kill_switch,initial_test_completed FROM runway_budget_policy WHERE policy_id=1;" > initial-reel-policy-reconciled.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT audit_id,event,detail,created_at FROM runway_audit_log WHERE audit_id='runway-initial-reel-v4-published-20260813';" > initial-reel-published-audit.json
          node ops/runway/verify_initial_reel_publish.mjs reconciled initial-reel-job-reconciled.json initial-reel-policy-reconciled.json initial-reel-published-audit.json
          echo '::notice::INITIAL_REEL_PUBLISHED verified=true duplicate=false kpi_attribution=started'

      - name: Preserve non-secret publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runway-initial-reel-publish-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            tools/line-worker/initial-reel-health.json
            tools/line-worker/initial-reel-recovery-bookmark-before.json
            tools/line-worker/initial-reel-job-preflight.json
            tools/line-worker/initial-reel-queue-preflight.json
            tools/line-worker/initial-reel-collision-preflight.json
            tools/line-worker/initial-reel-policy.json
            tools/line-worker/initial-reel-candidate-ffprobe.json
            tools/line-worker/initial-reel-candidate-evidence.json
            tools/line-worker/initial-reel-stage-mutation.json
            tools/line-worker/initial-reel-job-staged.json
            tools/line-worker/initial-reel-queue-staged.json
            tools/line-worker/initial-reel-collision-staged.json
            tools/line-worker/initial-reel-approve-mutation.json
            tools/line-worker/initial-reel-job-qa-approved.json
            tools/line-worker/initial-reel-queue-qa-approved.json
            tools/line-worker/initial-reel-approval-audit.json
            tools/line-worker/initial-reel-media-head.txt
            tools/line-worker/initial-reel-media-range-headers.txt
            tools/line-worker/initial-reel-release-mutation.json
            tools/line-worker/initial-reel-job-approved.json
            tools/line-worker/initial-reel-queue-approved.json
            tools/line-worker/initial-reel-publish-queue.json
            tools/line-worker/initial-reel-published-queue.json
            tools/line-worker/initial-reel-published-performance.json
            tools/line-worker/initial-reel-public-result.json
            tools/line-worker/initial-reel-reconcile-mutation.json
            tools/line-worker/initial-reel-job-reconciled.json
            tools/line-worker/initial-reel-policy-reconciled.json
            tools/line-worker/initial-reel-published-audit.json
          retention-days: 30

  # X上で削除済みとなったRunway動画2本の再投稿は、通常のpushでは動かさない。
  # 確認待ち登録と公開承認を別々のcommit markerへ固定し、どちらも正本CIの
  # テストと本番デプロイが成功した後にだけ実行する。
  hoshilu-x-reposts-stage-20260827:
    needs: [test, deploy]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.deploy.result == 'success' &&
      github.ref == 'refs/heads/feature/ui-search-v2' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[stage-hoshilu-x-reposts-20260827-approved]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: hoshilu-x-reposts-20260827
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage two X reposts as review-required
        working-directory: tools/line-worker
        run: node ops/runway/x_repost_20260827_ci.mjs stage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoshilu-x-reposts-stage-${{ github.run_id }}
          if-no-files-found: ignore
          path: tools/line-worker/x-repost-*.json
          retention-days: 30

  hoshilu-x-reposts-release-20260827:
    needs: [test, deploy]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.deploy.result == 'success' &&
      github.ref == 'refs/heads/feature/ui-search-v2' &&
