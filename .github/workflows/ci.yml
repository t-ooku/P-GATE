          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id,platform,campaign_id,content_id,caption,link,media_url,scheduled_at,status,affiliate,platform_job_id,external_post_id,last_error,approved_at,published_at,updated_at FROM social_post_queue WHERE post_id='hoshilu-runway-model-ugc-20260813-v1';" > initial-reel-queue-approved.json
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT audit_id,event,detail,created_at FROM runway_audit_log WHERE audit_id='runway-initial-reel-v4-qa-approved-20260813';" > initial-reel-approval-audit.json
          node ops/runway/verify_initial_reel_publish.mjs approved initial-reel-job-approved.json initial-reel-queue-approved.json initial-reel-approval-audit.json
          echo '::notice::INITIAL_REEL_APPROVED cron_publish_pending=true'

      - name: Monitor the existing idempotent publisher through completion
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          published=false
          for attempt in $(seq 1 105); do
            npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id,platform,campaign_id,content_id,caption,link,media_url,scheduled_at,status,affiliate,platform_job_id,external_post_id,last_error,approved_at,published_at,updated_at FROM social_post_queue WHERE post_id='hoshilu-runway-model-ugc-20260813-v1';" > initial-reel-publish-queue.json
            status="$(node ops/runway/verify_initial_reel_publish.mjs status initial-reel-publish-queue.json)"
            echo "Initial reel publication status: ${status} (check ${attempt}/105)"
            case "$status" in
              PUBLISHED) published=true; break ;;
              APPROVED|PUBLISHING) sleep 20 ;;
              FAILED)
                node -e "const d=require('./initial-reel-publish-queue.json');const r=(Array.isArray(d)?d:[d]).flatMap(x=>x.results||x.result?.results||[])[0];console.error('::error::INITIAL_REEL_PUBLISH_FAILED '+String(r?.last_error||'UNKNOWN').slice(0,300));"
                exit 1
                ;;
              *) echo "::error::Unexpected publication status: ${status}"; exit 1 ;;
            esac
          done
          if [ "$published" != true ]; then
            echo '::error::Initial reel publication monitor timed out without claiming success'
            exit 1
          fi

      - name: Resolve and verify the public Instagram permalink
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          resolved=false
          for attempt in $(seq 1 30); do
            http_status="$(curl --silent --show-error --output initial-reel-public-result.json --write-out '%{http_code}' 'https://hoshilu.app/api/social/posts/hoshilu-runway-model-ugc-20260813-v1')"
            if [ "$http_status" = 200 ] && node -e "const p=require('./initial-reel-public-result.json');if(p.ok!==true||!p.public_url)process.exit(1)"; then
              resolved=true
              break
            fi
            if [ "$http_status" != 200 ] && [ "$http_status" != 202 ]; then
              echo "Instagram permalink response: HTTP ${http_status} (check ${attempt}/30)"
            fi
            sleep 10
          done
          if [ "$resolved" != true ]; then
            echo '::error::Instagram publication exists but its public permalink was not confirmed'
            exit 1
          fi
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id,platform,campaign_id,content_id,caption,link,media_url,scheduled_at,status,affiliate,platform_job_id,external_post_id,last_error,approved_at,published_at,updated_at FROM social_post_queue WHERE post_id='hoshilu-runway-model-ugc-20260813-v1';" > initial-reel-published-queue.json
