name: Project GATE CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker
      - name: Run all regression tests
        run: npm test
      - name: Verify Worker package can be built
        working-directory: tools/line-worker
        run: npx wrangler deploy --dry-run
      - name: Block deterministic search-quality regressions
        working-directory: tools/line-worker
        run: npm run check:search-quality
      - name: Build single-file GAS bundle
        run: npm run build
      - name: Verify generated bundle is reproducible
        run: git diff --exit-code -- dist/Project_GATE_Complete.gs

  # feature/ui-search-v2 is the branch that tracks what's actually live on
  # hoshilu.app (confirmed 2026-08-06 - main has drifted 51 commits behind
  # with no merge path from this branch). Deploys the Worker only, and only
  # after the test job above is green.
  #
  # Deliberately narrow scope: D1 migrations and Secret rotation stay manual
  # per docs/HOSHILU_WORKER_RELEASE_RUNBOOK_2026-07-26.md (requires a D1
  # backup/verification step first) and
  # docs/HOSHILU_COMMAND_GOVERNANCE_2026-08-02.md (requires explicit
  # approval for production sync) - this job must not perform either
  # automatically.
  migrate-seller-console-d1:
    needs: test
    if: >-
      github.ref == 'refs/heads/feature/ui-search-v2' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[apply-0048]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-d1-seller-console
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker
      - name: Verify Cloudflare credentials are configured
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify historical schema and isolate migration 0048
        working-directory: tools/line-worker
        run: |
          output="$(npx wrangler d1 migrations list hoshilu-products --remote 2>&1)"
          echo "$output"
          pending=()
          while IFS= read -r migration; do
            name="$(basename "$migration")"
            if grep -Fq "$name" <<<"$output"; then
              pending+=("$name")
            fi
          done < <(find migrations -maxdepth 1 -type f -name '*.sql' -print | sort)
          expected="0037_contract_policy.sql 0038_multilingual_seo.sql 0039_kpi_measurement.sql 0040_social_knowledge.sql 0041_product_identifiers.sql 0042_hoshilu_product_schema.sql 0043_outbound_commerce_events.sql 0044_insight_search_watch.sql 0045_marketplace_ranking.sql 0046_ranking_sponsor_slots.sql 0047_growth_visitor_sessions.sql 0048_seller_priority_console.sql"
          if [ "${pending[*]}" != "$expected" ]; then
            echo "::error::Unexpected D1 migration state; found: ${pending[*]:-none}"
            exit 1
          fi

          historical_objects="contracts contracts_tenant contracts_competitor_group contract_decisions contract_decisions_contract contract_sync_batches product_aliases product_aliases_lookup localized_product_content localized_product_content_lookup multilingual_sync_batches kpi_events kpi_events_summary_scope kpi_summary kpi_uplift marketplace_kpi_events marketplace_kpi_events_summary_scope marketplace_kpi_summary anonymous_benchmark social_knowledge_inbox social_knowledge_inbox_duplicate_hash social_knowledge_inbox_review_status social_knowledge_aggregates social_hashtag_aggregates product_identifiers product_identifiers_lookup product_identifier_sync_batches hoshilu_products hoshilu_product_offers hoshilu_product_offers_by_product hoshilu_product_offers_by_identifier outbound_commerce_events outbound_commerce_events_by_destination outbound_commerce_events_by_seller search_watch_matches search_watch_matches_by_member marketplace_capabilities marketplace_ranking_cache idx_marketplace_ranking_cache_expiry ranking_sponsor_campaigns idx_ranking_sponsor_category_active growth_events_visitor_time growth_events_session_time"
          quoted="$(printf "'%s'," $historical_objects)"
          quoted="${quoted%,}"
          schema="$(npx wrangler d1 execute hoshilu-products --remote --json --command "SELECT name FROM sqlite_master WHERE name IN ($quoted) ORDER BY name;")"
          echo "$schema"
          for object in $historical_objects; do
            grep -Fq "\"$object\"" <<<"$schema" || { echo "::error::Historical schema object is missing: $object"; exit 1; }
          done

          member_columns="$(npx wrangler d1 execute hoshilu-products --remote --json --command "SELECT name FROM pragma_table_info('member_wishes') WHERE name IN ('notify_new_match','condition_snapshot') ORDER BY name;")"
          growth_columns="$(npx wrangler d1 execute hoshilu-products --remote --json --command "SELECT name FROM pragma_table_info('growth_events') WHERE name IN ('visitor_id','session_id') ORDER BY name;")"
          for column in notify_new_match condition_snapshot; do
            grep -Fq "\"$column\"" <<<"$member_columns" || { echo "::error::Historical member_wishes column is missing: $column"; exit 1; }
          done
          for column in visitor_id session_id; do
            grep -Fq "\"$column\"" <<<"$growth_columns" || { echo "::error::Historical growth_events column is missing: $column"; exit 1; }
          done

          mkdir -p migrations-0048
          cp migrations/0048_seller_priority_console.sql migrations-0048/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases = config.d1_databases.map((database) =>
            database.database_name === 'hoshilu-products'
              ? { ...database, migrations_dir: 'migrations-0048' }
              : database
          );
          fs.writeFileSync('wrangler.0048.json', JSON.stringify(config, null, 2));
          NODE
          isolated="$(npx wrangler d1 migrations list hoshilu-products --remote --config wrangler.0048.json 2>&1)"
          echo "$isolated"
          grep -Fq '0048_seller_priority_console.sql' <<<"$isolated" || { echo "::error::Migration 0048 is not pending in isolated config"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record D1 Time Travel restore point
        working-directory: tools/line-worker
        run: npx wrangler d1 time-travel info hoshilu-products --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply seller console migration
        working-directory: tools/line-worker
        run: npx wrangler d1 migrations apply hoshilu-products --remote --config wrangler.0048.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify seller console schema
        working-directory: tools/line-worker
        run: |
          output="$(npx wrangler d1 execute hoshilu-products --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('seller_priority_rules','seller_priority_memberships','seller_billing_wallets','seller_qualified_click_charges','seller_console_audit') ORDER BY name;")"
          echo "$output"
          for table in seller_priority_rules seller_priority_memberships seller_billing_wallets seller_qualified_click_charges seller_console_audit; do
            grep -Fq "\"$table\"" <<<"$output" || { echo "::error::Missing table $table"; exit 1; }
          done
          pending="$(npx wrangler d1 migrations list hoshilu-products --remote --config wrangler.0048.json 2>&1)"
          if grep -Fq '0048_seller_priority_console.sql' <<<"$pending"; then
            echo "::error::Migration 0048 is still pending"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: [test, migrate-seller-console-d1]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.migrate-seller-console-d1.result == 'success' &&
      github.ref == 'refs/heads/feature/ui-search-v2' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker
      - name: Check Cloudflare credentials are configured
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID repository secrets are not set - skipping deploy. See docs/HOSHILU_WORKER_RELEASE_RUNBOOK_2026-07-26.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Worker
        if: steps.creds.outputs.configured == 'true'
        working-directory: tools/line-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
