          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id,status,scheduled_at,external_post_id,published_at,last_error FROM social_post_queue WHERE post_id IN ('hoshilu-runway-name-forgotten-20260819-v1-x-repost-20260827','hoshilu-runway-overseas-find-20260819-v2-x-repost-20260827') ORDER BY post_id;" > x-repost-prioritized.json
          node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('x-repost-prioritized.json','utf8'));const rows=data.flatMap(x=>x.results||[]);const invalid=rows.length!==2||rows.some(r=>r.status==='PUBLISHED'?(!r.external_post_id||!r.published_at):(r.status!=='APPROVED'||r.scheduled_at!=='2000-01-01T00:00:00.000Z'||r.external_post_id||r.published_at||r.last_error));if(invalid)throw new Error(JSON.stringify(rows));"

