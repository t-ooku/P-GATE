name: Inspect Runway usage 2026-09-14
on:
  push:
    paths:
      - '.github/workflows/inspect-runway-usage-20260914.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Runway usage only
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
        run: |
          node <<'NODE'
          async function main() {
            if (!process.env.RUNWAYML_API_SECRET) throw new Error('missing secret');
            const response = await fetch('https://api.dev.runwayml.com/v1/organization/usage', {
              method: 'POST',
              headers: {
                accept: 'application/json',
                'content-type': 'application/json',
                authorization: 'Bearer ' + process.env.RUNWAYML_API_SECRET,
                'X-Runway-Version': '2024-11-06'
              },
              body: JSON.stringify({
                startDate: '2026-09-14T00:00:00.000Z',
                beforeDate: '2026-09-15T00:00:00.000Z'
              })
            });
            const text = await response.text();
            if (!response.ok) throw new Error('usage ' + response.status + ': ' + text.slice(0,500));
            console.log('RUNWAY_USAGE_BEGIN');
            console.log(text);
            console.log('RUNWAY_USAGE_END');
          }
          main().catch(e => { console.error(e); process.exit(1); });
          NODE
