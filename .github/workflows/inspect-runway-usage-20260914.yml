name: Inspect Runway task costs 2026-09-14
on:
  push:
    paths:
      - '.github/workflows/inspect-runway-usage-20260914.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Runway task metadata only
        env:
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
        run: |
          node <<'NODE'
          async function main() {
            const ids = [
              'f201d790-02eb-4b8c-a079-6840e897e16a',
              '7132fd9a-9ab7-47db-8698-97e5ce00e2cd',
              '5ef4a843-283c-4852-a08c-7136d0ae9f02',
              'f177fb53-e22a-4a9d-9cb1-207f6a0b1287'
            ];
            const headers = {
              accept: 'application/json',
              authorization: 'Bearer ' + process.env.RUNWAYML_API_SECRET,
              'X-Runway-Version': '2024-11-06'
            };
            for (const id of ids) {
              const response = await fetch('https://api.dev.runwayml.com/v1/tasks/' + id, {headers});
              const text = await response.text();
              console.log('TASK', id, response.status, text);
            }
          }
          main().catch(e => { console.error(e); process.exit(1); });
          NODE
