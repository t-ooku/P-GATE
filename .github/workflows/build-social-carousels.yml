name: Build social carousels (Pillow) and deploy

# 2026-09-17 大隆さん決定（SNS 方針 v3）: カルーセル画像フィード投稿を週 3 回（月・水・土）。
# 画像はバイナリなので Issue パッチ経由で置けない。scripts/build-social-carousels.py か
# ops/social/carousels-v3.json が push されると、このワークフローが ubuntu の Pillow + Noto CJK で
# JPEG を再生成し、feature/ui-search-v2 にコミットして Worker をデプロイする
# （assets として hoshilu.app/social/carousel/ から配信）。AI 生成・課金は発生しない。

on:
  push:
    branches: [feature/ui-search-v2]
    paths:
      - 'tools/line-worker/scripts/build-social-carousels.py'
      - 'tools/line-worker/ops/social/carousels-v3.json'
      - '.github/workflows/build-social-carousels.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Noto CJK font and Pillow
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk python3-pil
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc

      - name: Build the carousel images
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          python3 scripts/build-social-carousels.py /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
          ls -la public/social/carousel/*/
          python3 - <<'PY'
          import json
          from PIL import Image
          m = json.load(open('public/social/carousel/manifest.json'))
          for set_id, info in m['sets'].items():
              for f in info['files']:
                  im = Image.open('public/social/carousel/' + f['file'])
                  assert im.size == tuple(m['size']), (f['file'], im.size)
          print('carousel images verified:', sum(len(i['files']) for i in m['sets'].values()))
          PY

      - name: Commit the images
        id: commit
        run: |
          set -euo pipefail
          git config user.name "hoshilu-patch-bot"
          git config user.email "noreply@hoshilu.app"
          git add tools/line-worker/public/social/carousel
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "carousel images unchanged"
          else
            git commit -m "chore(social): カルーセル画像（方針 v3）を Pillow で再生成 [carousel-build]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Worker dependencies
        run: npm ci --prefix tools/line-worker

      - name: Validate exact production Worker bundle and bindings
        working-directory: tools/line-worker
        run: npx --yes wrangler@4.121.0 deploy --dry-run --outdir /tmp/hoshilu-worker-dry-run

      - name: Run all regression tests
        run: npm test

      - name: Push to production branch
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git pull --rebase origin feature/ui-search-v2
          git push origin HEAD:refs/heads/feature/ui-search-v2

      - name: Deploy Worker
        working-directory: tools/line-worker
        run: npx --yes wrangler@4.121.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health
        working-directory: tools/line-worker
        run: node scripts/check-production-health.mjs --attempts 6 --retry-ms 10000

      - name: Verify the carousel images are served
        run: |
          set -euo pipefail
          for f in user-hoshittoku-basics/1.jpg seller-demand-visible/4.jpg; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -I "https://hoshilu.app/social/carousel/$f")"
            echo "HEAD /social/carousel/$f -> $code"
            test "$code" = "200"
          done
