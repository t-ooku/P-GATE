name: Build social carousels (Pillow) and deploy

# 2026-09-17 大隆さん決定（SNS 方針 v3）: カルーセル画像フィード投稿を週 3 回（月・水・土）。
# 画像はバイナリなので Issue パッチ経由で置けない。scripts/build-social-carousels.py か
# ops/social/carousels-v3.json が push されると、このワークフローが ubuntu の Pillow + Noto CJK で
# JPEG を再生成し、feature/ui-search-v2 にコミットして Worker をデプロイする
# （assets として hoshilu.app/social/carousel/ から配信）。AI 生成・課金は発生しない。
# Issue パッチ（apply-patch.yml）経由の push ではこのワークフローは起動しない。定義だけ先に入れた時は、
# このファイルか carousels-v3.json を外から push して起動する（2026-09-27: 14 セット化で使用）。
# 2026-10-15 大隆さん指示「オウンドメディアの実画像・ホシルバズも載せて、見る人が興味を持つフィード投稿を」「価格だけぼかす」:
# 同じジョブで本番の実画面（買い物ノート・値下がり・ランキング×価格・ホシルバズ・検索）を Playwright で撮り、
# public/social/screens/<JST日付>/ に 1080×1350 のカルーセル画像を作る（scripts/build-social-screens.mjs）。
# 金額・値下がり率・差額は撮影前にぼかす。空の画面・ぼかし漏れがあれば失敗。毎週木曜 17:30 JST にも撮り直す。
# 失敗時はログの末尾を「[CI-LOG] …」Issue に残す（Claude/Cowork は Actions のログを読めないため）。
# 本番は CSP（style-src 'self'）があるので、撮影ブラウザだけ bypassCSP でぼかし用 CSS を当てる（#632）。

on:
  push:
    branches: [feature/ui-search-v2]
    paths:
      - 'tools/line-worker/scripts/build-social-carousels.py'
      - 'tools/line-worker/ops/social/carousels-v3.json'
      - 'tools/line-worker/scripts/build-social-screens.mjs'
      - '.github/workflows/build-social-carousels.yml'
  schedule:
    - cron: '30 8 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-search-v2
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Noto CJK font and Pillow
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/ci.log) 2>&1
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk python3-pil
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc

      - name: Build the carousel images
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/ci.log) 2>&1
          python3 scripts/build-social-carousels.py /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
          ls -la public/social/carousel/*/
          python3 - <<'PY'
          import json
          from PIL import Image
          m = json.load(open('public/social/carousel/manifest.json'))
          for set_id, info in m['sets'].items():
              for f in info['files']:
                  im = Image.open('public/social/carousel/' + f['file'])
                  assert im.size == tuple(m['size']), (f['file'], im.size)
          print('carousel images verified:', sum(len(i['files']) for i in m['sets'].values()))
          PY

      - name: Install Worker dependencies and Playwright (not saved)
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/ci.log) 2>&1
          npm ci
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Capture the real HOSHILU screens (prices blurred)
        id: screens
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/ci.log) 2>&1
          day="$(TZ=Asia/Tokyo date +%Y%m%d)"
          out="public/social/screens/${day}"
          node scripts/build-social-screens.mjs "$out" --base https://hoshilu.app
          python3 - "$out" <<'PY'
          import json, sys
          from pathlib import Path
          from PIL import Image
          out = Path(sys.argv[1])
          m = json.loads((out / 'manifest.json').read_text())
          assert len(m['files']) == 5, m
          for f in m['files']:
              im = Image.open(out / f['file'])
              assert im.size == (1080, 1350), (f, im.size)
          print('screens verified:', [f['file'] for f in m['files']])
          PY
          echo "day=${day}" >> "$GITHUB_OUTPUT"

      - name: Commit the images
        id: commit
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/ci.log) 2>&1
          git config user.name "hoshilu-patch-bot"
          git config user.email "noreply@hoshilu.app"
          git add tools/line-worker/public/social/carousel tools/line-worker/public/social/screens
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "carousel images unchanged"
          else
            git commit -m "chore(social): カルーセル画像（方針 v3）を Pillow で再生成 [carousel-build]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate exact production Worker bundle and bindings
        working-directory: tools/line-worker
        run: npx --yes wrangler@4.121.0 deploy --dry-run --outdir /tmp/hoshilu-worker-dry-run 2>&1 | tee -a /tmp/ci.log

      - name: Run all regression tests
        run: npm test 2>&1 | tail -n 400 | tee -a /tmp/ci.log

      - name: Push to production branch
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/ci.log) 2>&1
          git pull --rebase origin feature/ui-search-v2
          git push origin HEAD:refs/heads/feature/ui-search-v2

      - name: Deploy Worker
        working-directory: tools/line-worker
        run: npx --yes wrangler@4.121.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health
        working-directory: tools/line-worker
        run: node scripts/check-production-health.mjs --attempts 6 --retry-ms 10000

      - name: Verify the carousel images are served
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/ci.log) 2>&1
          for f in user-hoshittoku-basics/1.jpg seller-demand-visible/4.jpg user-media-price-drops/1.jpg user-media-ranking-price/1.jpg; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -I "https://hoshilu.app/social/carousel/$f")"
            echo "HEAD /social/carousel/$f -> $code"
            test "$code" = "200"
          done
          for n in 1 2 3 4 5; do
            f="${{ steps.screens.outputs.day }}/${n}.jpg"
            code="$(curl -s -o /dev/null -w '%{http_code}' -I "https://hoshilu.app/social/screens/$f")"
            echo "HEAD /social/screens/$f -> $code"
            test "$code" = "200"
          done

      - name: Report the failure log to an issue (Claude/Cowork cannot read Actions logs)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/ci.log', 'utf8'); } catch { log = '(no log captured)'; }
            const tail = log.slice(-12000).replace(/```/g, "'''");
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[CI-LOG] build-social-carousels failed ${context.sha.slice(0, 7)}`,
              body: `run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`\n${tail}\n\`\`\``
            });
