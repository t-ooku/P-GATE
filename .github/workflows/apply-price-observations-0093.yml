name: Apply price observations migration 0093

# 2026-10-02 大隆さん承認「1.ok」（指示書「今ほしい人が買うためのサービス」§4④・§5）:
# 価格推移の追記型テーブル price_observations を本番 D1 に作る。
# apply-patch（GITHUB_TOKEN の push）は他の workflow を起動しないので、このファイル自体の外部 push で起動する。
# この1ファイルだけを migrations_dir にして適用し、他の未適用 migration には触れない。
# 2回目以降は d1_migrations に記録済みのため何も起きない（冪等）。

on:
  push:
    branches: [feature/ui-search-v2]
    paths:
      - '.github/workflows/apply-price-observations-0093.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-d1-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 0093 only
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          test -f migrations/0093_price_observations.sql
          mkdir -p .migration-price-observations-0093
          cp migrations/0093_price_observations.sql .migration-price-observations-0093/
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases = config.d1_databases.map(db => ({ ...db, migrations_dir: '.migration-price-observations-0093' }));
          fs.writeFileSync('wrangler-price-observations-0093.jsonc', JSON.stringify(config));
          JS
          npx --yes wrangler@4.121.0 d1 migrations apply PRODUCT_DB --remote --config wrangler-price-observations-0093.jsonc
      - name: Verify the table exists
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          # 2026-10-03: 結果本体（.[0].results）だけ残す。Issue コメントの 400 文字に meta が入って数字が見えなかったため。
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT COUNT(*) AS rows, COUNT(DISTINCT record_key) AS products, MIN(observed_date) AS since, MAX(observed_date) AS latest, SUM(marketplace='RAKUTEN_JP') AS rakuten, SUM(marketplace='YAHOO_JP') AS yahoo, SUM(source='search') AS src_search, SUM(source='rakuten_ranking_api') AS src_buzz, SUM(source='target_price_scan') AS src_watch, SUM(source='product_detail') AS src_detail FROM price_observations;" | jq -c '.[0].results' | tee price-observations-check.json
          grep -q '"rows"' price-observations-check.json
          # 10/3 カルーセル（#543: 送る直前に「（体験開始は準備中）」を外す）の確認。本文は出さず、準備中の有無だけ。
          npx --yes wrangler@4.121.0 d1 execute PRODUCT_DB --remote --json --command "SELECT post_id, status, substr(published_at,1,16) AS published_at, (caption LIKE '%準備中%') AS has_pending, substr(last_error,1,60) AS err FROM social_post_queue WHERE post_id LIKE 'hoshilu-carousel-v3-%-2026-10-03' OR post_id LIKE 'hoshilu-carousel-v3-fallback-%-2026-10-03' ORDER BY post_id;" | jq -c '.[0].results' | tee carousel-check.json || true
      # 結果を Issue #545（[PATCH] 価格推移の記録）に書く。サンドボックスから Actions の実行結果を読めないため。
      - name: Report to issue 545
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: tools/line-worker
        run: |
          set -euo pipefail
          status="${{ job.status }}"
          check="$(tr -d '\n' < price-observations-check.json 2>/dev/null | tail -c 900 || echo 'no check output')"
          carousel="$(tr -d '\n' < carousel-check.json 2>/dev/null | tail -c 900 || echo 'no carousel output')"
          body="migration 0093 workflow: **${status}** (run ${{ github.run_id }}, head ${GITHUB_SHA::7})\n\nprice_observations: \`${check}\`\n\ncarousel 2026-10-03: \`${carousel}\`"
          gh api repos/${{ github.repository }}/issues/545/comments -f body="$(printf '%b' "$body")"
