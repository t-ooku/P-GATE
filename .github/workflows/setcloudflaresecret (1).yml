name: Set Cloudflare Worker secret (manual, from staged GitHub secret)

# Manual-only, mirrors apply-teacher-dataset-d1.yml's safety pattern for
# writes outside the normal push->CI->deploy pipeline. Never runs on push.
#
# Why this exists: the Cloudflare dashboard is currently inaccessible
# (account 2FA recovery in progress, Cloudflare's own timeline is days, not
# hours) and `wrangler login` needs the same account, so it is blocked too.
# This lets a secret be set on the production Worker using the
# CLOUDFLARE_API_TOKEN GitHub Actions secret that ci.yml already uses
# successfully for every deploy, without the secret value ever being shown
# in chat, in this workflow's logs, or to anyone without repo admin access.
#
# Usage:
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: STAGING_SECRET_VALUE   Value: <the actual secret, e.g. the
#      Threads access token you just generated>
#   2. Actions tab -> "Set Cloudflare Worker secret" -> Run workflow.
#      secret_name: the target Worker secret name (e.g. THREADS_ACCESS_TOKEN)
#      confirm: APPLY
#   3. After it succeeds, delete the STAGING_SECRET_VALUE repository secret
#      (Settings -> Secrets and variables -> Actions -> STAGING_SECRET_VALUE
#      -> Remove) so it is not left sitting around longer than necessary.
#   4. Repeat for each secret you need to set (e.g. THREADS_USER_ID) -
#      overwrite STAGING_SECRET_VALUE with the next value each time.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Worker secret name to set (e.g. THREADS_ACCESS_TOKEN)'
        required: true
      confirm:
        description: 'Type APPLY to confirm writing this secret to the production Worker'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cloudflare-worker-secret-set
      cancel-in-progress: false
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "APPLY" ]; then
            echo "::error::confirm input must be exactly APPLY. Nothing was executed."
            exit 1
          fi

      - name: Check required secrets are configured
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID are not set."
            exit 1
          fi
          if [ -z "${{ secrets.STAGING_SECRET_VALUE }}" ]; then
            echo "::error::STAGING_SECRET_VALUE repository secret is not set. Add it first (see workflow comment header)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set the Worker secret
        working-directory: tools/line-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_NAME: ${{ github.event.inputs.secret_name }}
          SECRET_VALUE: ${{ secrets.STAGING_SECRET_VALUE }}
        run: |
          printf '%s' "$SECRET_VALUE" | npx --yes wrangler@4.121.0 secret put "$SECRET_NAME" --name project-gate-line-bridge

      - name: Reminder
        run: |
          echo "::notice::Secret $SECRET_NAME set on project-gate-line-bridge. Now delete the STAGING_SECRET_VALUE repository secret (Settings -> Secrets and variables -> Actions) so it isn't left around."
