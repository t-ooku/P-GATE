<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">HOSHILU X header — これ、ホシっといて。</title>
  <desc id="desc">HOSHILUのH、星、ブックマークを使ったX用ヘッダー画像</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8fd"/><stop offset=".48" stop-color="#f5efff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F238B5"/><stop offset=".5" stop-color="#8A4CF4"/><stop offset="1" stop-color="#258CFF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#5533a8" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
  <circle cx="1360" cy="40" r="260" fill="#258CFF" opacity=".08"/><circle cx="1175" cy="500" r="300" fill="#F238B5" opacity=".08"/>
  <path d="M0 430 C310 330 410 500 720 402 S1160 315 1500 390 V500 H0Z" fill="url(#brand)" opacity=".10"/>
  <g transform="translate(520 75)">
    <rect width="72" height="72" rx="18" fill="url(#brand)"/>
    <path d="M18 17Q18 14 21 14H27Q30 14 30 17V32H44V17Q44 14 47 14H53Q56 14 56 17V56Q56 60 53 58L50 56L47 58Q44 60 44 56V44H30V56Q30 59 27 59H21Q18 59 18 56Z" fill="#fff"/>
    <path d="M59 8C60 12 62 14 66 15C62 16 60 18 59 22C58 18 56 16 52 15C56 14 58 12 59 8Z" fill="#fff"/>
    <text x="100" y="55" font-family="'Arial Black','Noto Sans JP',sans-serif" font-size="48" font-weight="900" letter-spacing="4" fill="#11142d">HOSHILU</text>
  </g>
  <g transform="translate(520 180)" filter="url(#shadow)">
    <rect width="790" height="185" rx="34" fill="#ffffff" opacity=".96"/>
    <text x="52" y="88" font-family="'Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif" font-size="66" font-weight="900" fill="#11142d">これ、ホシっといて。</text>
    <rect x="52" y="116" width="620" height="8" rx="4" fill="url(#brand)"/>
    <text x="52" y="158" font-family="'Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif" font-size="24" font-weight="700" fill="#5b5d73">欲しいを、ちゃんと見つける。</text>
  </g>
  <text x="520" y="430" font-family="'Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif" font-size="22" font-weight="700" fill="#6e5bc4">気になった瞬間を、忘れない。</text>
</svg>
