  <defs><linearGradient id="g" x1="110" y1="120" x2="950" y2="1220"><stop stop-color="#f238b5"/><stop offset=".48" stop-color="#8a4cf4"/><stop offset="1" stop-color="#258cff"/></linearGradient></defs>
  <rect width="1080" height="1350" fill="#111c4e"/>
  <text x="90" y="120" font-family="Arial,'Noto Sans JP',sans-serif" font-size="28" font-weight="800" fill="#fff" opacity=".7">HOSHILU HABIT #01</text>
  <text x="90" y="300" font-family="Arial,'Noto Sans JP',sans-serif" font-size="92" font-weight="900" fill="#fff">今は買わない。</text>
  <text x="90" y="425" font-family="Arial,'Noto Sans JP',sans-serif" font-size="92" font-weight="900" fill="#fff">でも、忘れたくない。</text>
