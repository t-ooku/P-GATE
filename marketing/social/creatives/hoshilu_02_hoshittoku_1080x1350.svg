  <text x="540" y="970" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="30" font-weight="700" fill="#59617d">次に開いたとき、続きから探せる。</text>
  <text x="90" y="1200" font-family="Arial,'Noto Sans JP',sans-serif" font-size="34" font-weight="800" fill="#fff">#ホシル　#ほしっとく</text>
