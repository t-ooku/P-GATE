<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="brand" x1="100" y1="100" x2="970" y2="1250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F238B5"/>
      <stop offset=".48" stop-color="#8A4CF4"/>
      <stop offset="1" stop-color="#258CFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#4E3A8B" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="#F7F5FF"/>
  <circle cx="915" cy="165" r="310" fill="#8A4CF4" opacity=".08"/>
  <circle cx="115" cy="1215" r="350" fill="#258CFF" opacity=".08"/>

