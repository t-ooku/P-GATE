  <path d="M386 895h66" fill="none" stroke="#C7BCEB" stroke-width="7" stroke-linecap="round"/>
  <path d="M441 881l18 14-18 14" fill="none" stroke="#C7BCEB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="474" y="818" width="246" height="154" rx="36" fill="#F3EDFF"/>
  <circle cx="597" cy="864" r="30" fill="#8A4CF4"/>
  <path d="M584 864a13 13 0 1 0 13-13M597 846v10M612 856l-8 4" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="597" y="926" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="25" font-weight="900" fill="#111C4E">定期的に探す</text>
  <path d="M740 895h66" fill="none" stroke="#C7BCEB" stroke-width="7" stroke-linecap="round"/>
  <path d="M795 881l18 14-18 14" fill="none" stroke="#C7BCEB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
