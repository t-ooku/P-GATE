  <circle cx="894" cy="864" r="30" fill="#258CFF"/>
  <path d="M880 873h28l-5-8v-8a9 9 0 0 0-18 0v8z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <text x="894" y="926" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="23" font-weight="900" fill="#111C4E">通知</text>

  <rect x="120" y="1026" width="840" height="78" rx="27" fill="url(#brand)" opacity=".11"/>
  <text x="540" y="1077" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="28" font-weight="900" fill="#4F3B92">新しく一致する実在商品が見つかった時だけお知らせ</text>

  <rect x="202" y="1203" width="676" height="96" rx="48" fill="url(#brand)"/>
  <text x="540" y="1265" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="36" font-weight="900" fill="#fff">無料会員で探し続ける →</text>
  <text x="540" y="1320" text-anchor="middle" font-family="Arial,'Noto Sans JP',sans-serif" font-size="22" font-weight="700" fill="#777F9B">値下げ通知ではなく、新しい商品の発見通知です</text>
