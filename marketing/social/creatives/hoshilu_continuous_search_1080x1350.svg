  </g>
  <text x="120" y="598" font-family="Arial,'Noto Sans JP',sans-serif" font-size="25" font-weight="900" fill="#8A4CF4" letter-spacing="2">見つかるまで探す</text>
  <rect x="120" y="642" width="840" height="118" rx="30" fill="#F7F5FF"/>
  <text x="156" y="691" font-family="Arial,'Noto Sans JP',sans-serif" font-size="23" font-weight="800" fill="#737B96">保存した検索条件</text>
  <text x="156" y="733" font-family="Arial,'Noto Sans JP',sans-serif" font-size="31" font-weight="900" fill="#111C4E">韓国カフェで見た、丸い乳白色のライト</text>
  <rect x="120" y="818" width="246" height="154" rx="36" fill="#FFF0FB"/>
  <circle cx="243" cy="864" r="30" fill="#F238B5"/>
  <path d="M230 864h26M243 851v26" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
