    <rect width="68" height="68" rx="20" fill="url(#brand)"/>
    <path d="M20 19v30M48 19v30M20 34h9c4 0 6 2 9 7 3-5 5-7 10-7" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="46" font-family="Arial,'Noto Sans JP',sans-serif" font-size="34" font-weight="900" fill="#111C4E" letter-spacing="2">HOSHILU</text>
    <text x="275" y="45" font-family="Arial,'Noto Sans JP',sans-serif" font-size="23" font-weight="800" fill="#8A4CF4">ホシル</text>
  </g>

  <text x="72" y="210" font-family="Arial,'Noto Sans JP',sans-serif" font-size="27" font-weight="900" fill="#8A4CF4" letter-spacing="3">CONTINUOUS SEARCH</text>
  <text x="72" y="300" font-family="Arial,'Noto Sans JP',sans-serif" font-size="66" font-weight="900" fill="#111C4E">見つからなくても、</text>
  <text x="72" y="388" font-family="Arial,'Noto Sans JP',sans-serif" font-size="82" font-weight="900" fill="url(#brand)">終わりじゃない。</text>
  <text x="74" y="448" font-family="Arial,'Noto Sans JP',sans-serif" font-size="30" font-weight="700" fill="#555E7D">無料会員で有効にすると、HOSHILUが探し続けます。</text>

  <g filter="url(#shadow)">
