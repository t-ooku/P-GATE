<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="brand" x1="120" y1="80" x2="960" y2="1270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F238B5"/>
      <stop offset=".48" stop-color="#8A4CF4"/>
      <stop offset="1" stop-color="#258CFF"/>
    </linearGradient>
    <linearGradient id="soft" x1="160" y1="300" x2="930" y2="1110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0FB"/>
      <stop offset=".52" stop-color="#F5F0FF"/>
      <stop offset="1" stop-color="#EAF5FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#4E3A8B" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="#F7F5FF"/>
  <circle cx="930" cy="140" r="300" fill="#F238B5" opacity=".08"/>
  <circle cx="90" cy="1230" r="360" fill="#258CFF" opacity=".08"/>

