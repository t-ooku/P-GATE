    <text x="66" y="209" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="23" font-weight="900" fill="#111C4E">一言を入力</text>
  </g>

  <g transform="translate(112 902)">
    <circle cx="28" cy="30" r="28" fill="#F238B5"/>
