    <path d="M20 19v30M48 19v30M20 34h9c4 0 6 2 9 7 3-5 5-7 10-7" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="46" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="34" font-weight="900" fill="#111C4E" letter-spacing="2">HOSHILU</text>
    <text x="275" y="45" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="23" font-weight="800" fill="#8A4CF4">ホシル</text>
