    <text x="72" y="41" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="30" font-weight="900" fill="#111C4E">AIが特徴理解を補助</text>
    <path d="M570 30h70" fill="none" stroke="#C7BCEB" stroke-width="7" stroke-linecap="round"/>
    <path d="M630 16l18 14-18 14" fill="none" stroke="#C7BCEB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="708" cy="30" r="28" fill="#258CFF"/>
    <text x="708" y="41" text-anchor="middle" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="28" font-weight="900" fill="#fff">2</text>
    <text x="752" y="41" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="30" font-weight="900" fill="#111C4E">購入先候補へ</text>
