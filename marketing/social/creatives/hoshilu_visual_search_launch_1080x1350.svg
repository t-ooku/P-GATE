  <rect x="158" y="592" width="360" height="226" rx="26" fill="#fff" stroke="#D9D2F6" stroke-width="3"/>
  <circle cx="338" cy="705" r="78" fill="#FFE3F6"/>
  <path d="M296 739h84l-12-81h-60z" fill="#fff" stroke="#8A4CF4" stroke-width="8" stroke-linejoin="round"/>
  <rect x="320" y="627" width="36" height="34" rx="12" fill="#F238B5"/>
  <path d="M182 621h31M182 621v31M494 621h-31M494 621v31M182 789h31M182 789v-31M494 789h-31M494 789v-31" fill="none" stroke="#258CFF" stroke-width="7" stroke-linecap="round"/>

