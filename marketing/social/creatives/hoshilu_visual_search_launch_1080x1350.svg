  <text x="72" y="210" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="27" font-weight="900" fill="#8A4CF4" letter-spacing="3">NEW HOSHILU SEARCH</text>
  <text x="72" y="300" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="73" font-weight="900" fill="#111C4E">その「欲しい」、</text>
  <text x="72" y="388" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="84" font-weight="900" fill="url(#brand)">撮ってホシル。</text>
  <text x="74" y="448" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="30" font-weight="700" fill="#555E7D">名前が分からなくても、写真が手がかりになる。</text>

  <g filter="url(#shadow)">
