  <rect x="112" y="1002" width="856" height="100" rx="30" fill="#F7F5FF"/>
  <text x="540" y="1046" text-anchor="middle" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="25" font-weight="800" fill="#5A6281">写真・画像・投稿URLはHOSHILUに保存しません</text>
  <text x="540" y="1082" text-anchor="middle" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="21" font-weight="700" fill="#747B98">顔・住所・伝票などは写さないでください</text>

  <rect x="208" y="1210" width="664" height="94" rx="47" fill="url(#brand)"/>
  <text x="540" y="1271" text-anchor="middle" font-family="'Noto Sans CJK JP','Noto Sans JP',Arial,sans-serif" font-size="36" font-weight="900" fill="#fff">カメラで探してみる →</text>
